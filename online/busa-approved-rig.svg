<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" role="img" aria-labelledby="rigTitle rigDesc">
<title id="rigTitle">Установка БУСА-1М — утверждённая компоновка</title>
<desc id="rigDesc">Хромированный куб с уровнями, две колонны, соединительные трубки, правый холодильник со спиралью, синие капли и прозрачный мерный стакан. Векторная иллюстрация без потери чёткости.</desc>
<defs>
