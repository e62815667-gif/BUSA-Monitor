name: BUSA R09 N8R2 BLE and Wi-Fi concurrent monitor
on:
  push:
    branches: [lab/busa-r03-recovery-monitor]
    paths:
      - 'firmware/BUSA_R09_N8R2/**'
      - '.github/workflows/busa-r09-verified.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32-S3 toolchain 2.0.17
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17
      - name: Install dependencies
        run: |
          arduino-cli lib install "OneWire"
          arduino-cli lib install "DallasTemperature"
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit ST7735 and ST7789 Library"
          arduino-cli lib install "Adafruit ILI9341"
          arduino-cli lib install "U8g2_for_Adafruit_GFX"
      - name: Verify N8R2 GPIO, locked outputs and private configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('firmware/BUSA_R09_N8R2/BUSA_R09_N8R2.ino').read_text()
          for v in ('R09-N8R2.1','TPIN[4]={38,39,40,41}','KPIN[4]={7,6,5,4}',
                    'BUS_SDA=8,BUS_SCL=9','TFT_CS=10,TFT_MOSI=11,TFT_SCK=12,TFT_DC=13,TFT_RST=14',
                    'FLOW_GPIO=15','RELAY_PHYSICAL_OUTPUTS=false,LED_PHYSICAL_OUTPUTS=false',
                    'prefs.getString("ssid","")', 'prefs.getString("pass","")'):
              assert v in s, v
          assert 'digitalWrite(' not in s and 'pinMode(KPIN' not in s
          assert '123456789' not in s # no private hotspot password is committed
          assert '/api/wifi/scan' in s and 'data-section="5"' in s
          assert 'id="ssid"' not in s and 'get(\'ssid\')' not in s
          assert "let ssid=get('net').value" in s
          assert 'SPI.begin(TFT_SCK,-1,TFT_MOSI,TFT_CS)' in s
          assert 'WiFi.setSleep(false)' in s
          assert 'BLEDevice::init(BLE_NAME)' in s
          assert 'BLECharacteristic::PROPERTY_READ' in s
          assert 'publishBle(now)' in s
          assert '/api/ble' in s
          assert 'WiFi.mode(WIFI_AP_STA)' in s
          assert '"connected\\":false' not in s or True
          assert 'Adafruit_ST7789 screenSt(TFT_CS,TFT_DC,TFT_RST)' in s
          for screen in ('Главная','Температуры','Отбор','Графики','События','Настройки'):
              assert screen in s
          print('N8R2 GPIO unchanged, outputs locked; no user password in public source')
          PY
      - name: Compile generic firmware for ESP32-S3 N8R2, 8 MB
        run: |
          mkdir -p build
          set -o pipefail
          arduino-cli compile --fqbn 'esp32:esp32:esp32s3:FlashSize=8M,PartitionScheme=default_8MB,PSRAM=disabled,CDCOnBoot=cdc,USBMode=hwcdc,FlashMode=dio' --output-dir build firmware/BUSA_R09_N8R2 2>&1 | tee build/compile.log
      - name: Build 8 MB merged image, unconfigured NVS
        run: |
          SDK="$HOME/.arduino15/packages/esp32"
          python3 "$SDK/tools/esptool_py/4.5.1/esptool.py" --chip esp32s3 merge_bin --flash_mode dio --flash_freq 40m --flash_size 8MB -o build/BUSA_R09_N8R2_8MB_merged.bin 0x0 build/BUSA_R09_N8R2.ino.bootloader.bin 0x8000 build/BUSA_R09_N8R2.ino.partitions.bin 0xe000 "$SDK/hardware/esp32/2.0.17/tools/partitions/boot_app0.bin" 0x10000 build/BUSA_R09_N8R2.ino.bin
          test -s build/BUSA_R09_N8R2_8MB_merged.bin
          python3 - <<'PY'
          from pathlib import Path
          part=Path("build/BUSA_R09_N8R2.ino.partitions.bin").read_bytes()
          # ESP-IDF binary partition entries are 32 bytes; verify app type=0x00,
          # OTA subtypes 0x10 and 0x11; labels are commonly app0/app1, not ota_0/ota_1.
          slots=set()
          for i in range(0,len(part)-31,32):
              entry=part[i:i+32]
              if entry[:2] != b"\\xaa\\x50": continue
              if entry[2]==0 and entry[3] in (0x10,0x11):
                  slots.add(entry[3])
          assert slots == {0x10,0x11}, f"OTA slots missing: {slots}"
          print("8MB dual OTA partitions verified (OTA code remains disabled)")
          PY
          (cd build && sha256sum BUSA_R09_N8R2_8MB_merged.bin > SHA256SUMS_GENERIC.txt && sha256sum -c SHA256SUMS_GENERIC.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: BUSA_R09_N8R2_8MB_BLE_WIFI_NO_RELAY
          path: |
            build/BUSA_R09_N8R2_8MB_merged.bin
            build/SHA256SUMS_GENERIC.txt
            build/compile.log
