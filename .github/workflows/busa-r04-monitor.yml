name: BUSA R04 water monitor laboratory build
on:
  push:
    branches: [lab/busa-r03-recovery-monitor]
    paths:
      - 'firmware/BUSA_R04_MONITOR/**'
      - '.github/workflows/busa-r04-monitor.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install compiler
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17
      - name: Libraries
        run: |
          arduino-cli lib install "OneWire"
          arduino-cli lib install "DallasTemperature"
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit ST7735 and ST7789 Library"
          arduino-cli lib install "Adafruit ILI9341"
          arduino-cli lib install "U8g2_for_Adafruit_GFX"
      - name: Approved pins and output interlock
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("firmware/BUSA_R04_MONITOR/BUSA_R04_MONITOR.ino").read_text()
          for v in ("TPIN[4]={38,39,40,41}","KPIN[4]={7,6,5,4}","BUS_SDA=8,BUS_SCL=9",
                    "TFT_CS=10,TFT_MOSI=11,TFT_SCK=12,TFT_DC=13,TFT_RST=14",
                    "FLOW_GPIO=15","RELAY_PHYSICAL_OUTPUTS=false,LED_PHYSICAL_OUTPUTS=false"):
              assert v in s, v
          assert "digitalWrite(" not in s
          assert "pinMode(KPIN" not in s
          print("GPIO verified, output drivers disabled")
          PY
      - name: Compile
        run: |
          mkdir -p build
          set -o pipefail
          arduino-cli compile --fqbn 'esp32:esp32:esp32s3:FlashSize=16M,PSRAM=disabled,CDCOnBoot=cdc,USBMode=hwcdc,FlashMode=dio' --output-dir build firmware/BUSA_R04_MONITOR 2>&1 | tee build/compile.log
      - name: Merge and checksum
        run: |
          SDK="$HOME/.arduino15/packages/esp32"
          python3 "$SDK/tools/esptool_py/4.5.1/esptool.py" --chip esp32s3 merge_bin --flash_mode dio --flash_freq 40m --flash_size 16MB -o build/BUSA_R04_MONITOR_merged.bin 0x0 build/BUSA_R04_MONITOR.ino.bootloader.bin 0x8000 build/BUSA_R04_MONITOR.ino.partitions.bin 0xe000 "$SDK/hardware/esp32/2.0.17/tools/partitions/boot_app0.bin" 0x10000 build/BUSA_R04_MONITOR.ino.bin
          (cd build && sha256sum BUSA_R04_MONITOR_merged.bin > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: BUSA_R04_MONITOR_NOT_HARDWARE_TESTED
          path: |
            build/BUSA_R04_MONITOR_merged.bin
            build/SHA256SUMS.txt
            build/compile.log
