name: BUSA TFT Touch Bench
on:
  push:
    branches: [lab/busa-r03-recovery-monitor]
    paths:
      - 'firmware/BUSA_TFT_TOUCH_BENCH/**'
      - '.github/workflows/busa-tft-touch-bench.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32-S3 toolchain
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17
      - name: Install display library
        run: |
          arduino-cli lib install "GFX Library for Arduino@1.6.1"
      - name: Static safety audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('firmware/BUSA_TFT_TOUCH_BENCH/BUSA_TFT_TOUCH_BENCH.ino').read_text()
          for x in ('new Arduino_ST7796','0x38','BUSA-TFT-TEST','WiFi.softAP'):
              assert x in s,x
          for x in ('digitalWrite(', 'analogWrite(', 'KPIN', 'RELAY','Update.begin(', 'WiFiClientSecure', 'temperature', 'flowLpm'):
              assert x not in s,x
          print('Only safe low-voltage LCD/touch/Wi-Fi test; no actuators')
          PY
      - name: Compile ESP32-S3 N8R2 8MB
        run: |
          mkdir -p build
          arduino-cli compile --fqbn 'esp32:esp32:esp32s3:FlashSize=8M,PartitionScheme=default_8MB,PSRAM=disabled,CDCOnBoot=cdc,USBMode=hwcdc,FlashMode=dio' --output-dir build firmware/BUSA_TFT_TOUCH_BENCH
      - name: Prepare merged recovery BIN
        run: |
          SDK="$HOME/.arduino15/packages/esp32"
          python3 "$SDK/tools/esptool_py/4.5.1/esptool.py" --chip esp32s3 merge_bin --flash_mode dio --flash_freq 40m --flash_size 8MB -o build/BUSA_TFT_TOUCH_BENCH_8MB_merged.bin 0x0 build/BUSA_TFT_TOUCH_BENCH.ino.bootloader.bin 0x8000 build/BUSA_TFT_TOUCH_BENCH.ino.partitions.bin 0xe000 "$SDK/hardware/esp32/2.0.17/tools/partitions/boot_app0.bin" 0x10000 build/BUSA_TFT_TOUCH_BENCH.ino.bin
          (cd build && sha256sum BUSA_TFT_TOUCH_BENCH_8MB_merged.bin BUSA_TFT_TOUCH_BENCH.ino.bin > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: BUSA_TFT_TOUCH_BENCH_N8R2_DIAGNOSTIC
          path: |
            build/BUSA_TFT_TOUCH_BENCH_8MB_merged.bin
            build/BUSA_TFT_TOUCH_BENCH.ino.bin
            build/SHA256SUMS.txt
