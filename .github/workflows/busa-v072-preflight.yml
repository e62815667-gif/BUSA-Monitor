name: BUSA v0.7.2 source preflight
on:
  workflow_dispatch:
  push:
    branches: [busa-firmware-v0.7.2-build]
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect firmware inputs without modifying firmware
        shell: bash
        run: |
          set -euo pipefail
          echo "Branch: ${GITHUB_REF_NAME}"
          echo "Commit: ${GITHUB_SHA}"
          find . -maxdepth 5 -type f -not -path './.git/*' | sort
          echo "Checking ESP-IDF project and Arduino component..."
          test -f firmware/v0.7.2/CMakeLists.txt
          test -f firmware/v0.7.2/main/CMakeLists.txt
          test -f firmware/v0.7.2/main/idf_component.yml
          test -f firmware/v0.7.2/main/LabMain.cpp
          echo "Source structure is present; compilation workflow can be enabled after source review."
