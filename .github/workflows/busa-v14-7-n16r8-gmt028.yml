name: BUSA V14.7 N16R8 Keypad GPIO40-41 (No PCA9685)
on:
  push:
    branches:
      - release/busa-v14-7-keypad-gpio40-41-no-pca-20261102
      - release/busa-v14-7-online-design-20261102
      - release/busa-v14-7-approved-iphone-20261102
      - release/busa-v14-7-graphs-lanes-20261102
    paths:
      - 'firmware/BUSA_1M_WIFI_3v_GOOGLE/**'
      - '.github/workflows/busa-v14-7-n16r8-gmt028.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core and libraries
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17
          arduino-cli lib install "Adafruit BusIO@1.17.4"
          arduino-cli lib install "OneWire@2.3.8"
          arduino-cli lib install "DallasTemperature@4.0.6"
          arduino-cli lib install "Adafruit GFX Library@1.13.0"
          arduino-cli lib install "Adafruit ST7735 and ST7789 Library@1.12.0"
          arduino-cli lib install "Adafruit ILI9341@1.7.0"
          arduino-cli lib install "U8g2_for_Adafruit_GFX@1.8.0"
