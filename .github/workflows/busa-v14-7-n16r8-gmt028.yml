      - name: Check embedded iPhone JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          source=Path('firmware/BUSA_1M_WIFI_3v_GOOGLE/BUSA_Main.h').read_text()
          m=re.search(r'R"HTMLBUSA\((.*?)\)HTMLBUSA"',source,re.S)
          assert m,'Embedded HTML missing'
          script=re.search(r'<script>(.*?)</script>',m.group(1),re.S)
          assert script,'Embedded JavaScript missing'
          Path('/tmp/busa-v147-sound.js').write_text(script.group(1))
          assert m.group(1).count('<section')==m.group(1).count('</section>')
          PY
          node --check /tmp/busa-v147-sound.js
      - name: Unit-test independent sound alarm thresholds
        shell: bash
        run: |
          cat > /tmp/test-busa-v147-sound.cpp <<'CPP'
          #include "BUSA_SoundAlarmLogic.h"
          #include <cassert>
          #include <cmath>
          int main(){
            using namespace BusaSound;
            Channel a,b,c,d;
            assert(!evaluate(a,false,true,50,60,55));
            assert(a.reason==Disabled);
            assert(!evaluate(a,true,true,50,NAN,NAN));
            assert(a.reason==MissingThreshold);
            assert(!evaluate(a,true,true,59,60,55));
            assert(evaluate(a,true,true,60,60,55));
            assert(evaluate(a,true,true,57,60,55));
            assert(!evaluate(a,true,true,55,60,55));
            assert(evaluate(a,true,true,70,60,55));
            assert(!evaluate(a,true,false,70,60,55));
            assert(a.reason==SensorInvalid);
            assert(!evaluate(a,true,true,59,60,55));
            assert(!evaluate(b,true,true,22,20,25));
            assert(evaluate(b,true,true,20,20,25));
            assert(evaluate(b,true,true,23,20,25));
            assert(!evaluate(b,true,true,25,20,25));
            assert(evaluate(c,true,true,80,80,75));
            assert(!evaluate(c,false,true,80,80,75));
            assert(!evaluate(d,true,true,80,80,79.95));
            assert(d.reason==MissingThreshold);
            assert(evaluate(d,true,true,80,80,79.7));
            assert(d.reason==Sounding);
            assert(!evaluate(d,true,true,NAN,50,45));
            return 0;
          }
          CPP
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -I firmware/BUSA_1M_WIFI_3v_GOOGLE /tmp/test-busa-v147-sound.cpp -o /tmp/test-busa-v147-sound
          /tmp/test-busa-v147-sound
          echo 'PASS: alarm thresholds and missing sensors'
      - name: Test T3/T4 sound event routing, 90-sec pulse and separate T1/T2 buzzer
        shell: bash
        run: |
          cat >/tmp/test-busa-sound-routing.cpp <<'CPP'
          #include "BUSA_SoundAlarmLogic.h"
          #include <cassert>
          #include <cmath>
          int main(){
            using namespace BusaSound;
            const bool enabled[4]={true,true,true,true};
            Routed r;
            // Initial below the two activation points; no spontaneous pulse.
            evaluateRouted(r,enabled,true,60,80,75,true,60,85,80,1000);
            assert(!r.k[0]&&!r.k[1]&&!r.k[2]&&!r.k[3]);
            // T3 activation: K1 ON, K2 90-second close notification.
            evaluateRouted(r,enabled,true,81,80,75,true,60,85,80,1100);
            assert(r.k[0] && r.k[1] && !r.k[2] && !r.k[3]);
            evaluateRouted(r,enabled,true,81,80,75,true,60,85,80,91099);
            assert(r.k[1]);
            evaluateRouted(r,enabled,true,81,80,75,true,60,85,80,91100);
            assert(r.k[0] && !r.k[1]);
            // T4 activates: independent K4 ON, K2 again, K1 stays ON.
            evaluateRouted(r,enabled,true,81,80,75,true,86,85,80,91200);
            assert(r.k[0] && r.k[1] && r.k[3]);
            // T4 OFF must switch K4 OFF and trigger K3 without touching K1.
            evaluateRouted(r,enabled,true,81,80,75,true,79,85,80,91400);
            assert(r.k[0] && !r.k[1] && r.k[2] && !r.k[3]);
            assert(!r.k1Hold && !r.t3OffEvent && r.t4OffEvent);
            evaluateRouted(r,enabled,true,81,80,75,true,79,85,80,181399);
            assert(r.k[0] && r.k[2]);
            evaluateRouted(r,enabled,true,81,80,75,true,79,85,80,181400);
            assert(r.k[0] && !r.k[2]);
            // T3 OFF is the only temperature event that silences K1.
            evaluateRouted(r,enabled,true,74,80,75,true,79,85,80,181500);
            assert(!r.k[0] && !r.k[3] && r.k[2] && r.t3OffEvent);
            // Reaching ON threshold again re-enables K1.
            evaluateRouted(r,enabled,true,81,80,75,true,79,85,80,182000);
            assert(r.k[0]);
            // Invalid T4 sensor must not itself generate K3 or silence K1.
            resetRouted(r);
            evaluateRouted(r,enabled,true,81,80,75,true,86,85,80,200000);
            evaluateRouted(r,enabled,true,81,80,75,false,NAN,85,80,200200);
            assert(r.k[0] && !r.t4OffEvent && !r.k[2]);
            // Dedicated T1/T2 buzzer OR using independent channel thresholds.
            Channel t1,t2;
            assert(!evaluate(t1,true,true,25,30,29));
            assert(!evaluate(t2,true,true,25,40,39));
            assert(evaluate(t1,true,true,31,30,29));
            assert(!evaluate(t2,true,true,25,40,39));
            assert(!evaluate(t1,true,true,28,30,29));
            assert(evaluate(t2,true,true,41,40,39));
            assert(!evaluate(t2,true,true,38,40,39));
            return 0;
          }
          CPP
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -I firmware/BUSA_1M_WIFI_3v_GOOGLE /tmp/test-busa-sound-routing.cpp -o /tmp/test-busa-sound-routing
          /tmp/test-busa-sound-routing
          echo 'PASS: routed K1-K4, T4 OFF retains K1, T1-T2 independent logic'
      - name: Prepare verified Google Trust Services TLS certificate bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,ssl,subprocess,urllib.request
          # Google Trust Services' published SHA256 fingerprints (DER).
          fingerprints={
            'gtsr1':'d947432abde7b7fa90fc2e6b59101b1280e0e1c7e4e40fa3c6887fff57a7f4cf',
            'gtsr2':'8d25cd97229dbf70356bda4eb3cc734031e24cf00fafcfd32dc76eb5841c7ea8',
            'gtsr3':'34d8a73ee208d9bcdb0d956520934b4e40e69482596e8b6f73c8426b010a6f48',
            'gtsr4':'349dfa4058c5e263123b398ae795573c4e1313c83fe68f93556cd5e8031b3c7d',
          }
          bundle=[]
          for name,expected in fingerprints.items():
              url='https://pki.goog/repo/certs/'+name+'.pem'
              data=urllib.request.urlopen(url,timeout=20).read()
              pem=data.decode('ascii').strip()
              assert pem.count('-----BEGIN CERTIFICATE-----')==1,name
              der=ssl.PEM_cert_to_DER_cert(pem)
              digest=hashlib.sha256(der).hexdigest()
              assert digest==expected, f'Untrusted {name}: {digest}'
              path=Path('/tmp')/(name+'.pem')
              path.write_text(pem+'\n')
              subprocess.run(['openssl','x509','-in',str(path),'-noout','-checkend','86400'],check=True)
              bundle.append(pem)
              print(name,'SHA256',digest)
          combined='\n'.join(bundle)+'\n'
          assert combined.count('-----BEGIN CERTIFICATE-----')==4
          Path('firmware/BUSA_1M_WIFI_3v_GOOGLE/BUSA_GoogleCA.h').write_text(
              'const char GOOGLE_TRUST_ANCHOR[] PROGMEM=R"GOOGLECERT(\n'+combined+')GOOGLECERT";\n')
          PY
      - name: Compile V14.7 for ESP32-S3 N16R8
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build_busa_v147
          arduino-cli compile --clean --fqbn 'esp32:esp32:esp32s3:FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,PSRAM=opi,CDCOnBoot=cdc,USBMode=hwcdc,FlashMode=qio' --output-dir build_busa_v147 firmware/BUSA_1M_WIFI_3v_GOOGLE | tee build_busa_v147/build.log
      - name: Create two verified images
        shell: bash
        run: |
          set -euo pipefail
          SDK="$HOME/.arduino15/packages/esp32"
          python3 "$SDK/tools/esptool_py/4.5.1/esptool.py" --chip esp32s3 merge_bin --flash_mode dio --flash_freq 40m --flash_size 16MB -o build_busa_v147/BUSA_V14_7_GRAPHLANES_KEYPAD40_41_N16R8_FULL_USB.bin 0x0 build_busa_v147/BUSA_1M_WIFI_3v_GOOGLE.ino.bootloader.bin 0x8000 build_busa_v147/BUSA_1M_WIFI_3v_GOOGLE.ino.partitions.bin 0xe000 "$SDK/hardware/esp32/2.0.17/tools/partitions/boot_app0.bin" 0x10000 build_busa_v147/BUSA_1M_WIFI_3v_GOOGLE.ino.bin
          cp build_busa_v147/BUSA_1M_WIFI_3v_GOOGLE.ino.bin build_busa_v147/BUSA_V14_7_GRAPHLANES_KEYPAD40_41_N16R8_APP_OTA.bin
          git rev-parse HEAD > build_busa_v147/SOURCE_COMMIT.txt
          (cd build_busa_v147 && sha256sum BUSA_V14_7_GRAPHLANES_KEYPAD40_41_N16R8_FULL_USB.bin BUSA_V14_7_GRAPHLANES_KEYPAD40_41_N16R8_APP_OTA.bin > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          python3 - <<'PY'
          from pathlib import Path
          root=Path('build_busa_v147')
          full=(root/'BUSA_V14_7_GRAPHLANES_KEYPAD40_41_N16R8_FULL_USB.bin').read_bytes()
          app=(root/'BUSA_V14_7_GRAPHLANES_KEYPAD40_41_N16R8_APP_OTA.bin').read_bytes()
          assert 60000<len(app)<0x300000
          assert len(full)<16*1024*1024
          assert full[0x10000:0x10000+len(app)]==app, 'Merged USB and OTA content differs'
