name: BUSA R03 recovery USB laboratory build
on:
  workflow_dispatch:
  push:
    branches: [lab/busa-r03-recovery-monitor]
    paths:
      - 'firmware/BUSA_R03_RECOVERY/**'
      - '.github/workflows/busa-r03-recovery.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 Arduino 2.0.17
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17
      - name: Install monitor libraries
        run: |
          arduino-cli lib install "OneWire"
          arduino-cli lib install "DallasTemperature"
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit ST7735 and ST7789 Library"
      - name: Confirm GPIO map and no physical outputs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("firmware/BUSA_R03_RECOVERY/BUSA_R03_RECOVERY.ino")
          s=p.read_text()
          for exact in ("TPIN[4]={38,39,40,41}", "KPIN[4]={7,6,5,4}", "BUS_SDA=8,BUS_SCL=9",
                        "TFT_CS=10,TFT_MOSI=11,TFT_SCK=12,TFT_DC=13,TFT_RST=14",
                        "RELAY_PHYSICAL_OUTPUTS=false,LED_PHYSICAL_OUTPUTS=false"):
              assert exact in s, "Missing approved map: "+exact
          assert "digitalWrite(" not in s and "pinMode(" not in s, "Unexpected direct output write"
          print("Approved GPIO map checked; no direct GPIO output writes.")
          PY
      - name: Compile ESP32-S3 16MB no-PSRAM native USB CDC
        run: |
          arduino-cli compile --fqbn 'esp32:esp32:esp32s3:FlashSize=16M,PSRAM=disabled,CDCOnBoot=cdc,USBMode=hwcdc,FlashMode=dio' --output-dir build firmware/BUSA_R03_RECOVERY
      - name: Generate one-file merged BIN and checksum
        run: |
          SDK="$HOME/.arduino15/packages/esp32"
          python3 "$SDK/tools/esptool_py/4.5.1/esptool.py" --chip esp32s3 merge_bin --flash_mode dio --flash_freq 40m --flash_size 16MB -o build/BUSA_R03_RECOVERY_NO_PSRAM_merged.bin 0x0 build/BUSA_R03_RECOVERY.ino.bootloader.bin 0x8000 build/BUSA_R03_RECOVERY.ino.partitions.bin 0xe000 "$SDK/hardware/esp32/2.0.17/tools/partitions/boot_app0.bin" 0x10000 build/BUSA_R03_RECOVERY.ino.bin
          test -s build/BUSA_R03_RECOVERY_NO_PSRAM_merged.bin
          (cd build && sha256sum BUSA_R03_RECOVERY_NO_PSRAM_merged.bin > SHA256SUMS.txt)
          (cd build && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: BUSA_R03_RECOVERY_NO_PSRAM_UNTESTED
          path: |
            build/BUSA_R03_RECOVERY_NO_PSRAM_merged.bin
            build/SHA256SUMS.txt
