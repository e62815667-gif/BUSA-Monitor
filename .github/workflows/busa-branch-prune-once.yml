name: BUSA one-time merged PR branch cleanup
on:
  push:
    branches: [main]
    paths: [.github/workflows/busa-branch-prune-once.yml]
permissions:
  contents: write
jobs:
  prune-merged:
    runs-on: ubuntu-latest
    steps:
      - name: Check merged PRs and branch heads before deletion
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for spec in \
            "8|feature/online-approved-live-20261102|5bb4db5000e75c190912fde12ea523a8cb899bcd" \
            "10|feature/busa-pwa-remote-threshold-release-20261103|4bd93df320dc95e5f394b6af92667a9002fd64d5"; do
            IFS='|' read -r pr branch expected <<< "${spec}"
            actual=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha')
            merged=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq '.merged_at')
            merged_ref=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq '.head.ref')
            pr_sha=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq '.head.sha')
            [[ "${actual}" == "${expected}" && "${pr_sha}" == "${expected}" && "${merged_ref}" == "${branch}" && "${merged}" != "null" ]] || { echo "Mismatch or PR not merged; aborting: ${branch}"; exit 1; }
            echo "Verified PR #${pr} and branch ${branch}"
          done
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/feature/online-approved-live-20261102"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/feature/busa-pwa-remote-threshold-release-20261103"
          echo "Two merged PR branches removed. Main preserved."
