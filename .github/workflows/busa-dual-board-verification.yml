name: BUSA dual-board COLL1 and display OTA build
on:
  push:
    branches: [lab/guition-n4r8-display-check-20261124, feat/busa-dual-ota-20261125, fix/busa-display-bootdiag1-20261125, fix/busa-performance1-20261125, fix/busa-performance2-20261125, fix/busa-performance3-20261125, fix/busa-guition-hq-20261125, fix/busa-actual-hw1-20261125, fix/busa-latency-perf4-20261125, fix/busa-guition-ui2-20261125, fix/busa-guition-ui3-20261125, fix/busa-guition-ui4-20261125, fix/busa-guition-ui5-20261125, fix/busa-guition-ui6-20261125, fix/busa-guition-ui7-20261125]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.3.1
      - name: Verify GPIO15 mathematics and telemetry contract
        run: |
          set -euo pipefail
          g++ -std=c++11 -Wall -Wextra -Werror tests/test_water_flow_math.cpp -o /tmp/busa-water-flow-test
          /tmp/busa-water-flow-test
          g++ -std=c++11 -Wall -Wextra -Werror tests/test_uart_frame.cpp -o /tmp/busa-uart-test
          /tmp/busa-uart-test
          g++ -std=c++11 -Wall -Wextra -Werror tests/test_display_p1_wiring.cpp -o /tmp/busa-p1-wiring-test
          /tmp/busa-p1-wiring-test
          g++ -std=c++11 -Wall -Wextra -Werror tests/test_uart_tx_budget.cpp -o /tmp/busa-uart-budget-test
          /tmp/busa-uart-budget-test
          node tests/test_perf1_polling.cjs
          g++ -std=c++11 -Wall -Wextra -Werror tests/test_perf2.cpp -o /tmp/busa-perf2-test
          /tmp/busa-perf2-test
          g++ -std=c++11 -pthread -Wall -Wextra -Werror tests/test_uart_tx_mailbox.cpp -o /tmp/busa-mailbox-test
          /tmp/busa-mailbox-test
          g++ -std=c++11 -Wall -Wextra -Werror tests/test_display_protocol.cpp -o /tmp/busa-display-protocol-test
          /tmp/busa-display-protocol-test
          g++ -std=c++11 -Wall -Wextra -Werror tests/test_display_api.cpp -o /tmp/busa-display-api-test
          /tmp/busa-display-api-test
          g++ -std=c++11 -Wall -Wextra -Werror tests/test_touch_calibration.cpp -o /tmp/busa-touch-test
          /tmp/busa-touch-test
          node tests/test_display_receiver.cjs
          python3 -B tests/test_collection.py
          python3 -B tests/test_hw1_contract.py
          g++ -std=c++11 -Wall -Wextra -Werror tests/test_hw2_keys.cpp -o /tmp/busa-hw2-keys
          /tmp/busa-hw2-keys
          python3 -B tests/test_hw2_contract.py
          python3 -B tests/test_latency_contract.py
          python3 -B tests/test_latency_temperature.py
          g++ -std=c++11 -Wall -Wextra -Werror tests/test_latency_dirty_rows.cpp -o /tmp/busa-latency-dirty
          /tmp/busa-latency-dirty
          g++ -std=c++11 -pthread -Wall -Wextra -Werror -Itests/fixtures/http_latency_mock tests/test_latency_http.cpp -o /tmp/busa-latency-http
          timeout 15 /tmp/busa-latency-http
          python3 -B tests/test_ui12_audit.py
          node tests/test_hw1_receiver.cjs
          g++ -std=c++11 -Wall -Wextra -Werror -Ifirmware/common/src tests/test_display_ota_protocol.cpp -o /tmp/busa-ota-protocol-test
          /tmp/busa-ota-protocol-test
          g++ -std=c++11 -Wall -Wextra -Werror -Ifirmware/common/src tests/test_display_ota_sender.cpp -o /tmp/busa-ota-sender-test
          /tmp/busa-ota-sender-test
          python3 -B tests/test_display_ota_receiver.py
          python3 -B tests/test_display_ota_partitions.py firmware/BUSA_Display_N4R8/partitions.csv
          node tests/test_display_ota_ui.cjs
          python3 - <<'PY'
          import re,subprocess
          from pathlib import Path
          source=Path('firmware/BUSA_1M_WIFI_3v_GOOGLE/BUSA_Main.h').read_text()
          for script in re.findall(r'<script>(.*?)</script>',source,re.S):
              subprocess.run(['node','--check'],input=script.encode(),check=True)
          PY
          python3 -B tests/test_water_config_contract.py
          python3 -B -m unittest discover -s tests -p test_firmware_contract.py -v
          python3 -B ci/generate_calculator.py --check
          python3 -B ci/generate_viewport.py --check
          python3 -B ci/generate_design.py --check
      - name: Install pinned Arduino toolchain and libraries
        run: |
          set -euo pipefail
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17
          arduino-cli lib install "OneWire@2.3.8"
          arduino-cli lib install "DallasTemperature@4.0.6"
      - name: Generate Google trust bundle
        run: python3 ci/generate_google_ca.py --output firmware/BUSA_1M_WIFI_3v_GOOGLE/BUSA_GoogleCA.h
      - name: Compile firmware for ESP32-S3 N16R8
        run: |
          set -euo pipefail
          mkdir -p out
          arduino-cli compile --clean --fqbn 'esp32:esp32:esp32s3:FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,PSRAM=opi,CDCOnBoot=cdc,USBMode=hwcdc,FlashMode=qio,DebugLevel=none' --library firmware/common --output-dir out firmware/BUSA_1M_WIFI_3v_GOOGLE

      - name: Package and verify N16R8 USB and OTA
        run: |
          set -euo pipefail
          python3 ci/package_ui16.py --build-dir out --core-dir "$HOME/.arduino15/packages/esp32/hardware/esp32/2.0.17" --esptool "$HOME/.arduino15/packages/esp32/tools/esptool_py/4.5.1/esptool.py"
          mkdir -p dual_delivery_main
          cp out/BUSA_UI16_CUBE1_MOTION1_USB_MERGED.bin dual_delivery_main/MAIN_USB_MERGED.bin
          cp out/BUSA_UI16_CUBE1_MOTION1_APP_OTA.bin dual_delivery_main/MAIN_OTA.bin
          git archive --format=zip -o dual_delivery_main/SOURCE.zip HEAD firmware/BUSA_1M_WIFI_3v_GOOGLE firmware/BUSA_Display_N4R8 firmware/common ci tests .github/workflows/busa-dual-board-verification.yml AGENTS.md docs/BUSA_BASELINE_2026-11-23.md
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          root=Path('dual_delivery_main')
          usb=root/'MAIN_USB_MERGED.bin'
          ota=root/'MAIN_OTA.bin'
          assert usb.read_bytes()[0x10000:]==ota.read_bytes()
          assert b'display_diagnostics' in ota.read_bytes()
          assert b'UNRELIABLE_PULSES' in ota.read_bytes()
          assert b'UART2-COLL1-DISPLAYOTA1-P1-20261125-PERF4-HW2' in ota.read_bytes()
          assert b'main_uart_tx_worker_max_ms' in ota.read_bytes()
          assert b'loop_profile' in ota.read_bytes()
          assert b'/api/display-ota/upload' in ota.read_bytes()
          checks=[]
          for p in (usb,ota):
              data=p.read_bytes()
              assert data[0]==0xe9
              digest=hashlib.sha256(data).hexdigest()
              checks.append(f'{digest}  {p.name}')
              print(p.name,len(data),digest)
          (root/'SHA256SUMS.txt').write_text('\n'.join(checks)+'\n')
          (root/'SOURCE_COMMIT.txt').write_bytes(subprocess.check_output(['git','rev-parse','HEAD']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: BUSA_ESP32_PERF4_HW2
          retention-days: 30
          path: dual_delivery_main/
          if-no-files-found: error

  display_firmware:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        core: ["2.0.17", "3.0.0"]
    env:
      CORE_VERSION: ${{ matrix.core }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.3.1
      - name: Install display compiler dependencies
        run: |
          set -euo pipefail
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install "esp32:esp32@$CORE_VERSION"
          arduino-cli lib install "GFX Library for Arduino@1.5.0"
          arduino-cli lib install "XPT2046_Touchscreen@1.4"
          arduino-cli lib install "ArduinoJson@7.4.3"
          arduino-cli lib install "lvgl@8.4.0"
      - name: Prepare approved graphics and Cyrillic font
        run: |
          set -euo pipefail
          g++ -std=c++11 -Wall -Wextra -Werror tests/test_guition_startup.cpp -o /tmp/busa-guition-startup
          /tmp/busa-guition-startup
          python3 -B tests/test_guition_frame_contract.py
          python3 -B tests/test_guition_touch_timing.py
          python3 -B tests/test_guition_boot_isolation.py
          python3 -B tests/test_guition_geometry.py
          python3 -B tests/test_guition_hq_layout.py
          python3 -B tests/test_guition_fixed_layout.py
          g++ -std=c++11 -Wall -Wextra -Werror tests/test_guition_focus_order.cpp -o /tmp/busa-ui2-focus
          /tmp/busa-ui2-focus
          mkdir -p display_delivery
          python3 -m pip install --disable-pip-version-check 'Pillow==13.0.0' 'esptool==4.5.1'
          python3 -c 'import serial, bitstring, cryptography, reedsolo'
          python3 ci/generate_guition_asset.py
          python3 ci/generate_guition_icons.py
          npx --yes lv_font_conv@1.5.3 --font /usr/share/fonts/truetype/dejavu/DejaVuSansCondensed.ttf --range 0x20-0x7e,0xa0-0xff,0x400-0x52f,0x2013-0x2026,0x2190-0x2193 --size 14 --bpp 4 --format lvgl --no-compress --lv-include lvgl.h --output firmware/BUSA_Display_N4R8/busa_font.c
          npx --yes lv_font_conv@1.5.3 --font /usr/share/fonts/truetype/dejavu/DejaVuSansCondensed.ttf --range 0x20-0x7e,0xa0-0xff,0x400-0x52f,0x2013-0x2026,0x2190-0x2193 --size 12 --bpp 4 --format lvgl --no-compress --lv-include lvgl.h --output firmware/BUSA_Display_N4R8/busa_font_small.c
          npx --yes lv_font_conv@1.5.3 --font /usr/share/fonts/truetype/dejavu/DejaVuSansCondensed.ttf --range 0x20-0x7e,0xa0-0xff,0x400-0x52f,0x2013-0x2026,0x2190-0x2193 --size 11 --bpp 4 --format lvgl --no-compress --lv-include lvgl.h --output firmware/BUSA_Display_N4R8/busa_font_nav.c
          npx --yes lv_font_conv@1.5.3 --font /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf --range 0x20-0x7e,0xa0-0xff,0x400-0x52f,0x2013-0x2026,0x2190-0x2193 --size 20 --bpp 4 --format lvgl --no-compress --lv-include lvgl.h --output firmware/BUSA_Display_N4R8/busa_font_value.c
          if [ "$CORE_VERSION" = "3.0.0" ]; then python3 -B tests/test_guition_lvgl_layout.py "$HOME/Arduino/libraries/lvgl"; fi
          cp firmware/BUSA_1M_WIFI_3v_GOOGLE/BUSA_Calculator.h firmware/BUSA_Display_N4R8/
          cp firmware/BUSA_1M_WIFI_3v_GOOGLE/BUSA_CalcCoefficients.h firmware/BUSA_Display_N4R8/
      - name: Compile GUITION N4R8 native interface
        run: |
          set -euo pipefail
          flags='-DLV_CONF_SKIP -DLV_MEM_SIZE=98304'
          if [ "$CORE_VERSION" = "3.0.0" ]; then flags="-MMD -c $flags"; fi
          arduino-cli compile --clean --library firmware/common --build-property "compiler.cpp.extra_flags=$flags" --build-property "compiler.c.extra_flags=$flags" --fqbn 'esp32:esp32:esp32s3:FlashSize=4M,PartitionScheme=huge_app,PSRAM=opi,CDCOnBoot=cdc,USBMode=hwcdc,FlashMode=dio,DebugLevel=none' --output-dir display_out firmware/BUSA_Display_N4R8
      - name: Package GUITION USB image and verify flash boundaries
        run: |
          set -euo pipefail
          core="$HOME/.arduino15/packages/esp32/hardware/esp32/$CORE_VERSION"
          prefix=display_out/BUSA_Display_N4R8.ino
          if [ "$CORE_VERSION" = "2.0.17" ]; then
            config="$core/tools/sdk/esp32s3/sdkconfig"
          else
            config=$(find "$HOME/.arduino15/packages/esp32/tools/esp32-arduino-libs" -path '*/esp32s3/sdkconfig' -type f -print -quit)
          fi
          test -n "$config" && grep -qx 'CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=y' "$config"
          cp "$config" display_delivery/SDKCONFIG.txt
          python3 -m esptool --chip esp32s3 image_info --version 2 "$prefix.bin" > display_delivery/OTA_IMAGE_INFO.txt
          cp "$prefix.bin" display_delivery/DISPLAY_OTA.bin
          python3 -m esptool --chip esp32s3 merge_bin -o display_delivery/DISPLAY_USB_MERGED.bin --flash_mode dio --flash_size 4MB 0x0 "$prefix.bootloader.bin" 0x8000 "$prefix.partitions.bin" 0xe000 "$core/tools/partitions/boot_app0.bin" 0x10000 "$prefix.bin"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,struct,os
          b=Path('display_delivery/DISPLAY_USB_MERGED.bin')
          app=Path('display_out/BUSA_Display_N4R8.ino.bin').read_bytes()
          data=b.read_bytes()
          assert data[0]==0xe9 and data[0x10000:0x10000+len(app)]==app
          assert 60000<len(app)<=0x1c0000 and len(data)<=0x1d0000
          major='5' if os.environ['CORE_VERSION']=='3.0.0' else '4'
          assert ('BUSA-DISPLAY-N4R8-OTA1-BD2-I'+major+'-P1-U7-HW2').encode() in app
          assert b'[BOOT] FIRST_FRAME OK' in app
          assert b'[BOOT] PSRAM ' in app
          assert b'[BOOT] LCD GEOMETRY ' in app
          assert b'[BOOT] CANVAS ALIGNED ' in app
          assert b'14v9-N16R8-' not in app
          assert app[0]==0xe9 and struct.unpack_from('<H',app,12)[0]==9
          info=(b.parent/'OTA_IMAGE_INFO.txt').read_text()
          assert 'Checksum:' in info and 'Validation hash:' in info and info.count('(valid)')>=2
          raw=Path('display_out/BUSA_Display_N4R8.ino.partitions.bin').read_bytes()
          entries={}
          for pos in range(0,len(raw)-31,32):
              magic,typ,sub,offset,size,label,flags=struct.unpack_from('<HBBII16sI',raw,pos)
              if magic!=0x50aa:break
              entries[label.split(b'\0',1)[0].decode()]=(typ,sub,offset,size)
          assert entries['app0']==(0,0x10,0x10000,0x1c0000)
          assert entries['app1']==(0,0x11,0x1d0000,0x1c0000)
          assert entries['nvs'][2:]==(0x9000,0x5000)
          assert all(offset+size<=0x400000 for typ,sub,offset,size in entries.values())
          checks=[]
          for f in [b,b.parent/'DISPLAY_OTA.bin']:
              digest=hashlib.sha256(f.read_bytes()).hexdigest();checks.append(digest+'  '+f.name);print(f.name,f.stat().st_size,digest)
          (b.parent/'SHA256SUMS.txt').write_text('\n'.join(checks)+'\n')
          PY
          git rev-parse HEAD > display_delivery/SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BUSA_SCREEN_U7_HW2_${{ matrix.core }}
          path: display_delivery/
          if-no-files-found: error
