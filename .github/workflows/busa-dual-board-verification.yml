name: BUSA dual-board integration verification
on:
  push:
    branches: [lab/guition-n4r8-display-check-20261124]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.3.1
      - name: Verify GPIO15 mathematics and telemetry contract
        run: |
          set -euo pipefail
          g++ -std=c++11 -Wall -Wextra -Werror tests/test_water_flow_math.cpp -o /tmp/busa-water-flow-test
          /tmp/busa-water-flow-test
          g++ -std=c++11 -Wall -Wextra -Werror tests/test_uart_frame.cpp -o /tmp/busa-uart-test
          /tmp/busa-uart-test
          g++ -std=c++11 -Wall -Wextra -Werror tests/test_display_protocol.cpp -o /tmp/busa-display-protocol-test
          /tmp/busa-display-protocol-test
          node tests/test_display_receiver.cjs
          python3 -B tests/test_water_config_contract.py
          python3 -B -m unittest discover -s tests -p test_firmware_contract.py -v
          python3 -B ci/generate_calculator.py --check
          python3 -B ci/generate_viewport.py --check
          python3 -B ci/generate_design.py --check
      - name: Install pinned Arduino toolchain and libraries
        run: |
          set -euo pipefail
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17
          arduino-cli lib install "Adafruit BusIO@1.17.4"
          arduino-cli lib install "OneWire@2.3.8"
          arduino-cli lib install "DallasTemperature@4.0.6"
          arduino-cli lib install "Adafruit GFX Library@1.13.0"
          arduino-cli lib install "Adafruit ST7735 and ST7789 Library@1.12.0"
          arduino-cli lib install "Adafruit ILI9341@1.7.0"
          arduino-cli lib install "U8g2_for_Adafruit_GFX@1.8.0"
      - name: Generate Google trust bundle
        run: python3 ci/generate_google_ca.py --output firmware/BUSA_1M_WIFI_3v_GOOGLE/BUSA_GoogleCA.h
      - name: Compile firmware for ESP32-S3 N16R8
        run: |
          set -euo pipefail
          mkdir -p out
          arduino-cli compile --clean --fqbn 'esp32:esp32:esp32s3:FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,PSRAM=opi,CDCOnBoot=cdc,USBMode=hwcdc,FlashMode=qio,DebugLevel=none' --library firmware/common --output-dir out firmware/BUSA_1M_WIFI_3v_GOOGLE

      - name: Package and verify N16R8 USB and OTA
        run: |
          set -euo pipefail
          python3 ci/package_ui16.py --build-dir out --core-dir "$HOME/.arduino15/packages/esp32/hardware/esp32/2.0.17" --esptool "$HOME/.arduino15/packages/esp32/tools/esptool_py/4.5.1/esptool.py"
          mkdir -p delivery
          cp out/BUSA_UI16_CUBE1_MOTION1_USB_MERGED.bin delivery/BUSA_MAIN_N16R8_USB.bin
          cp out/BUSA_UI16_CUBE1_MOTION1_APP_OTA.bin delivery/BUSA_MAIN_N16R8_OTA.bin
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          root=Path('delivery')
          usb=root/'BUSA_MAIN_N16R8_USB.bin'
          ota=root/'BUSA_MAIN_N16R8_OTA.bin'
          assert usb.read_bytes()[0x10000:]==ota.read_bytes()
          assert b'display_diagnostics' in ota.read_bytes()
          assert b'UNRELIABLE_PULSES' in ota.read_bytes()
          checks=[]
          for p in (usb,ota):
              data=p.read_bytes()
              assert data[0]==0xe9
              digest=hashlib.sha256(data).hexdigest()
              checks.append(f'{digest}  {p.name}')
              print(p.name,len(data),digest)
          (root/'SHA256SUMS.txt').write_text('\n'.join(checks)+'\n')
          (root/'SOURCE_COMMIT.txt').write_bytes(subprocess.check_output(['git','rev-parse','HEAD']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: BUSA_MAIN_N16R8_USB_OTA
          retention-days: 30
          path: delivery/
          if-no-files-found: error

  display_components:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.3.1
      - name: Install display compiler dependencies
        run: |
          set -euo pipefail
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17
          arduino-cli lib install "GFX Library for Arduino@1.5.0"
          arduino-cli lib install "XPT2046_Touchscreen@1.4"
          arduino-cli lib install "ArduinoJson@7.4.3"
      - name: Compile hardware and UART components without release artifacts
        run: |
          set -euo pipefail
          mkdir -p /tmp/BusaDisplayCompile
          cp firmware/BUSA_Display_N4R8/*.h /tmp/BusaDisplayCompile/
          cp tests/fixtures/display_component_compile.ino /tmp/BusaDisplayCompile/BusaDisplayCompile.ino
          arduino-cli compile --clean --library firmware/common --fqbn 'esp32:esp32:esp32s3:FlashSize=4M,PartitionScheme=huge_app,PSRAM=opi,CDCOnBoot=cdc,USBMode=hwcdc,FlashMode=dio,DebugLevel=none' /tmp/BusaDisplayCompile
