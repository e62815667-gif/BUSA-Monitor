name: BUSA full Git backup and branch cleanup (one-time)
on:
  push:
    branches: [main]
    paths: [.github/workflows/busa-full-archive-branch-cleanup-once.yml]
permissions:
  contents: write
jobs:
  backup_verify_cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      ARCHIVE_TAG: busa-git-backup-all-branches-20261115
      BUNDLE: BUSA_FULL_GIT_20261115.bundle
    steps:
      - name: Clone mirror, make full self-contained bundle and test restoration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/busa" 
          cd "$RUNNER_TEMP/busa"
          git clone --mirror "https://github.com/$GITHUB_REPOSITORY.git" mirror.git
          git -C mirror.git for-each-ref --format='%(objectname) %(refname)' refs/heads | LC_ALL=C sort > all-branches.txt
          test "$(wc -l < all-branches.txt)" -eq 137
          git -C mirror.git bundle create "$PWD/$BUNDLE" --all
          git bundle list-heads "$BUNDLE" | grep ' refs/heads/' | LC_ALL=C sort > bundle-branches.txt
          diff -u all-branches.txt bundle-branches.txt
          git init -q --bare verify.git
          git -C verify.git bundle verify "$PWD/$BUNDLE"
          git -C verify.git fetch -q "$PWD/$BUNDLE" 'refs/heads/*:refs/heads/*'
          git -C verify.git for-each-ref --format='%(objectname) %(refname)' refs/heads | LC_ALL=C sort > restored.txt
          diff -u all-branches.txt restored.txt
          cat > keep-base.txt <<'KEEPLIST'
          main
          architecture/busa-v15-modular-monitor-20261027
          feat/busa-calculator-20261105
          fix/busa-rainmaker-telemetry-20261105
          fix/busa-rainmaker-live-telemetry-20261105
          fix/busa-wifi-single-scanner-driver-20261105
          fix/busa-ble-ota-stable-20261105
          fix/busa-official-rainmaker-ble-20261105
          fix/busa-v14-9-independent-ui-sta-switch-20261103
          fix/busa-v14-7-keypad-persist-backup-20261103
          release/busa-v14-7-wifi-google-stable-20261103
          release/busa-v14-7-original-n16r8-sound4-corrected-20261101
          release/busa-v14-7-smooth-google-ca-bundle-20261102
          KEEPLIST
          gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" > open-prs.json
          jq -r '.[] | .head.ref, .base.ref' open-prs.json >> keep-base.txt
          sort -u keep-base.txt > keep.txt
          awk '{print $1, substr($2,12)}' all-branches.txt | while read -r sha name; do
            if ! grep -Fxq "$name" keep.txt; then
              echo "$sha $name"
            fi
          done > archive-only.txt
          keep_count=$(wc -l < keep.txt)
          archive_count=$(wc -l < archive-only.txt)
          test "$keep_count" -ge 15
          test "$archive_count" -ge 80
          test "$((keep_count + archive_count))" -eq 137
          while read -r keep; do
            grep -Fqx "refs/heads/$keep" <(cut -d' ' -f2 all-branches.txt)
          done < keep.txt
          cat > HOW_TO_RESTORE.txt <<'RESTORE'
          Archive of all 137 BUSA-Monitor Git branches, before cleanup on 15 November 2026.
          The full bundle was restored to a new bare repository and every SHA checked.
          all-branches.txt maps every branch to its exact commit SHA.
          Restore a specific branch from a local cloned repository:
            git fetch /path/to/BUSA_FULL_GIT_20261115.bundle <commit-SHA>
            git switch -c <branch-name> FETCH_HEAD
          The working UI16 USB and OTA binary files are separately held on Google Drive.
          No exact UI16 source commit has been identified in GitHub.
          RESTORE
          sha256sum "$BUNDLE" all-branches.txt keep.txt archive-only.txt HOW_TO_RESTORE.txt > SHA256SUMS.txt
          echo "All 137 refs restorable. Keeping $keep_count active; preparing to archive $archive_count."
      - name: Publish archive to permanent GitHub Release and independently recheck download
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/busa"
          if gh release view "$ARCHIVE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Archive release already exists. Refusing to replace." 
            exit 1
          fi
          gh release create "$ARCHIVE_TAG" "$BUNDLE" all-branches.txt keep.txt archive-only.txt HOW_TO_RESTORE.txt SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "BUSA complete Git backup of 137 branches (2026-11-15)" --notes "Full self-contained repository Git bundle, SHA256 manifests and full restoration verification. Preserve this release. UI16 BIN files remain separately in Google Drive; exact UI16 sources still require identification." --prerelease
          mkdir -p downloaded
          gh release download "$ARCHIVE_TAG" --repo "$GITHUB_REPOSITORY" --dir downloaded
          (cd downloaded && sha256sum -c SHA256SUMS.txt)
          git bundle list-heads "$PWD/downloaded/$BUNDLE" | grep ' refs/heads/' | LC_ALL=C sort > downloaded-branches.txt
          diff -u downloaded/all-branches.txt downloaded-branches.txt
          git init -q --bare verify-download.git
          git -C verify-download.git bundle verify "$PWD/downloaded/$BUNDLE"
          git -C verify-download.git fetch -q "$PWD/downloaded/$BUNDLE" 'refs/heads/*:refs/heads/*'
          git -C verify-download.git for-each-ref --format='%(objectname) %(refname)' refs/heads | LC_ALL=C sort > verified-restored.txt
          diff -u downloaded/all-branches.txt verified-restored.txt
          echo "Permanent GitHub Release downloaded, hashed, tested, full 137 branch restore confirmed"
      - name: Protect open pull requests, verify exact refs and remove archive-only branches
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/busa"
          gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" > open-now.json
          jq -r '.[] | .head.ref, .base.ref' open-now.json > open-now-names.txt
          while read -r sha name; do
            if grep -Fxq "$name" open-now-names.txt; then
              echo "Now used in an open PR: $name. Aborting."
              exit 1
            fi
          done < archive-only.txt
          gh api "repos/$GITHUB_REPOSITORY/git/refs/heads" --jq '.[] | [.object.sha, .ref] | join(" ")' | LC_ALL=C sort > remote-now.txt
          diff -u all-branches.txt remote-now.txt
          deleted=0
          while read -r sha name; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$name" >/dev/null
            deleted=$((deleted + 1))
            echo "Archived and removed: $name"
            sleep 0.3
          done < archive-only.txt
          gh api "repos/$GITHUB_REPOSITORY/git/refs/heads" --jq '.[].ref' | sed 's#^refs/heads/##' | LC_ALL=C sort > after.txt
          diff -u keep.txt after.txt
          echo "Verified: deleted $deleted archive-only branches and preserved all live keep refs."
