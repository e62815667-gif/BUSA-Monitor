name: BUSA Google Build
on:
  push:
    branches: [lab/busa-v14-14-google-readonly-audit-20261023, fix/busa-v14-20-verified-sensors-keypad-wifi-20261023, fix/busa-v14-21-wifi-20261023]
    paths:
      - 'firmware/BUSA_1M_WIFI_3v_GOOGLE/**'
      - 'tests/**'
      - '.github/workflows/busa-google-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17
      - run: |
          arduino-cli lib install "ArduinoJson@6.21.5"
          arduino-cli lib install "OneWire"
          arduino-cli lib install "DallasTemperature"
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit ST7735 and ST7789 Library"
          arduino-cli lib install "Adafruit ILI9341"
          arduino-cli lib install "U8g2_for_Adafruit_GFX"
      - name: Test DS18B20 address-specific reads and inactive keypad conflict
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('firmware/BUSA_1M_WIFI_3v_GOOGLE/BUSA_Main.h').read_text()
          if '14v20-N8R2-VERIFIED-ROM-KEYPAD-WIFI' in src:
              for expected in ('getTempC(wireProbe[i].rom)',
                               'requestTemperaturesByAddress(wireProbe[i].rom)',
                               'sensors[i]->isConnected(wireProbe[i].rom)',
                               'p.searchNoise=!secondValid',
                               'second_rom', 'rom_search_noise',
                               'if(pair<0||keyHeld'):
                  assert expected in src, expected
              assert 'getTempCByIndex(0)' not in src
              assert 'return ambiguous?-2:found;' in src
              assert 'RELAY_PHYSICAL_OUTPUTS=false,LED_PHYSICAL_OUTPUTS=false' in src
          PY
      - name: Test Wi-Fi recovery and Safari timeouts
        run: |
          python3 tests/test_wifi_recovery.py
          node tests/test_local_fetch.js
      - name: Test Google response and redirect handling
        run: python3 tests/test_google_transport.py
      - name: Generate and validate GTS Root R1–R4 trust anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          roots = {}
          expected_sha256 = {
            'R1':'D947432ABDE7B7FA90FC2E6B59101B1280E0E1C7E4E40FA3C6887FFF57A7F4CF',
            'R2':'8D25CD97229DBF70356BDA4EB3CC734031E24CF00FAFCFD32DC76EB5841C7EA8',
            'R3':'34D8A73EE208D9BCDB0D956520934B4E40E69482596E8B6F73C8426B010A6F48',
            'R4':'349DFA4058C5E263123B398AE795573C4E1313C83FE68F93556CD5E8031B3C7D',
          }
          for n in ('R1','R2','R3','R4'):
            file = Path('/etc/ssl/certs/GTS_Root_'+n+'.pem')
            if file.is_file():
              pem=file.read_text()
            else:
              # Hosted Ubuntu runners do not guarantee every GTS root exists.
              # Fetch ONLY from Google's official CA repository, then pin SHA256.
              import urllib.request
              url='https://pki.goog/repo/certs/gtsr'+n[1]+'.pem'
              try:
                with urllib.request.urlopen(url,timeout=25) as response:
                  pem=response.read(12000).decode('ascii')
              except Exception as ex:
                raise RuntimeError('Unable to obtain GTS '+n+' from verified repository') from ex
              file=Path('/tmp/BUSA_GTS_Root_'+n+'.pem')
              file.write_text(pem)
            assert pem.count('-----BEGIN CERTIFICATE-----')==1, n
            fingerprint=subprocess.check_output(['openssl','x509','-in',str(file),'-noout','-fingerprint','-sha256'],text=True).strip().split('=',1)[1].replace(':','').upper()
            assert fingerprint==expected_sha256[n], f'{n}: unexpected trust anchor {fingerprint}'
            roots[n]=pem.strip()
          bundle='\n'.join(roots[n] for n in ('R1','R2','R3','R4'))+'\n'
          assert bundle.count('-----BEGIN CERTIFICATE-----')==4
          p=Path('firmware/BUSA_1M_WIFI_3v_GOOGLE/BUSA_GoogleCA.h')
          p.write_text('const char GOOGLE_TRUST_ANCHOR[] PROGMEM=R"GOOGLECERT(\n'+bundle+')GOOGLECERT";\n')
          print('Verified trust anchors: GTS R1, R2, R3, R4. TLS verification is mandatory.')
          PY
      - run: |
          mkdir -p build
          arduino-cli compile --fqbn 'esp32:esp32:esp32s3:FlashSize=8M,PartitionScheme=default_8MB,PSRAM=disabled,CDCOnBoot=cdc,USBMode=hwcdc,FlashMode=dio' --output-dir build firmware/BUSA_1M_WIFI_3v_GOOGLE
      - name: Verify GPIO and compile-time safety restrictions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          a=Path('firmware/BUSA_1M_WIFI_3v_GOOGLE/BUSA_Main.h').read_text()
          b=Path('firmware/BUSA_1M_WIFI_3v_GOOGLE/BUSA_Google.h').read_text()
          for term in ('TPIN[4]={16,17,18,21}','KPIN[4]={7,6,5,4}', 'FLOW_GPIO=15',
                       'RELAY_PHYSICAL_OUTPUTS=false,LED_PHYSICAL_OUTPUTS=false',
                       'WiFi.mode(WIFI_AP_STA)','/api/google/config',
                       'setInterval(update,1500)'):
              assert term in a, term
          assert "WiFiClientSecure" in b and "setCACert" in b
          roots=Path('firmware/BUSA_1M_WIFI_3v_GOOGLE/BUSA_GoogleCA.h').read_text()
          assert roots.count('-----BEGIN CERTIFICATE-----')==4, 'four GTS certs needed'
          assert 'setInsecure(' not in a+b, 'TLS verification must remain on'
          for forbidden in ('BLEDevice','BLESecurity','digitalWrite(', 'pinMode(KPIN', 'setInsecure('):
              assert forbidden not in a+b, forbidden
          ui=Path('firmware/BUSA_1M_WIFI_3v_GOOGLE/BUSA_ApprovedUI_V13.h').read_text()
          if '13v-APPROVED-UI' in a:
              assert '#include "BUSA_ApprovedUI_V13.h"' in a
              for item in ('v13Home','v13Temperatures','v13Collection','v13Graphs','v13EventsPage','v13Settings','renderPortrait'):
                  assert item in ui, item
              assert 'digitalWrite(' not in ui
          if '14v-' in a:
              land=Path('firmware/BUSA_1M_WIFI_3v_GOOGLE/BUSA_Landscape_V14.h').read_text()
              assert '#include "BUSA_Landscape_V14.h"' in a
              for item in ('renderLandscape','v14Frame','v14MiniRig','v14Temperature','v14Collection','v14Settings','v14Graphs','v14Events','UI_ORDER[6]={0,1,2,5,3,4}','drawBootSplash(8000)','otaActive'):
                  assert item in a+land, item
              if 'HQ-APPROVED-LANDSCAPE' in a:
                  art=Path('firmware/BUSA_1M_WIFI_3v_GOOGLE/BUSA_ApprovedGraphics_HQ_V14.h').read_text()
                  assert '#include "BUSA_ApprovedGraphics_HQ_V14.h"' in a
                  for ref in ('hqRig','hqPanel','hqBackground','hqSymbol','HQ_CYAN'):
                      assert ref in art, ref
                  for unsafe in ('digitalWrite(', 'pinMode(', 'ledcWrite(', 'relay', 'HTTPClient'):
                      assert unsafe not in art, unsafe
              if '14v3-DISPLAY-GOOGLE-FINAL' in a:
                  google = Path('firmware/BUSA_1M_WIFI_3v_GOOGLE/BUSA_Google.h').read_text()
                  assert 'ru.drawUTF8(x,y,v.c_str())' in a, 'UTF-8 renderer not active'
                  assert 'screenSt.enableDisplay(false)' in a and 'screenSt.enableDisplay(true)' in a, 'display standby/wake'
                  assert 'TFT_DISPLAY_IDLE_MS=300000' in a and 'if(tftDisplayOff)' in a, 'standby without suspending MCU'
                  assert '/api/tft/screen' in a and '/api/google/test' in google, 'missing local controls'
                  assert 'statusJSON()' in google and '30000' in google, 'Google diagnostic telemetry cadence'
                  assert 'KPIN[4]={7,6,5,4}' in a and 'RELAY_PHYSICAL_OUTPUTS=false' in a
                  assert Path('google/BUSA_GoogleSheets_Receiver.gs').is_file()
              if '14v2-LIGHT-FONT-FIX' in a:
                  assert 'ru.setFontMode(1);' in a[a.index('void ruText('):a.index('void panelAt(')], 'transparent Cyrillic renderer missing'
              if '14v-LIGHT-WATER-UI-FIX' in a:
                  for term in ('graphSubView=0','waterPulseHistory[40]','waterPulseDelta','startKeyLearning','tftProfile=1;tftRotation=1;tftInverted=false'):
                      assert term in a, term
                  for term in ('v14GraphTabs','v14Graphs','YF-S401','ВОДА YF','К1-К4'):
                      assert term in land, term
                  assert 'tftProfile=1' in a and '0x000000' not in land
              for forbidden in ('digitalWrite(', 'pinMode(KPIN','ledcWrite(', 'WiFiClientSecure::setInsecure'):
                  assert forbidden not in land, forbidden
          print('Passive GPIO only; output relays remain locked')
          PY
      - name: Verify Google receiver JavaScript syntax
        run: |
          cp google/BUSA_GoogleSheets_Receiver.gs /tmp/BUSA_GoogleSheets_Receiver.js
          node --check /tmp/BUSA_GoogleSheets_Receiver.js
      - name: Verify read-only V14.14 Google release and token safety
        run: node tests/test_google_release_v1414.js
      - name: Validate both iPhone app scripts and manual-only screen behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          main=Path('firmware/BUSA_1M_WIFI_3v_GOOGLE/BUSA_Main.h').read_text()
          app=Path('index.html').read_text()
          assert '14v21-N8R2-WIFI-DUAL-SCAN-DIAG' in main or '14v20-N8R2-VERIFIED-ROM-KEYPAD-WIFI' in main or '14v15-N8R2-MODULE-DIAG' in main
          assert 'tft_theme_mode' in main
          assert 'server.arg("theme")' in main
          assert 'setTftPhysicalTheme(theme)' in main
          assert 'tftThemeSelect' in main
          assert 'window.confirm(' in main
          assert 'prefs.putBool("tftDarkColor",dark)' in main
          assert 'RELAY_PHYSICAL_OUTPUTS=false,LED_PHYSICAL_OUTPUTS=false' in main
          assert 'TPIN[4]={16,17,18,21}' in main
          assert 'TPIN[0]==16 && TPIN[1]==17 && TPIN[2]==18 && TPIN[3]==21' in main
          assert 'Температура: T1 GPIO16, T2 GPIO17, T3 GPIO18, T4 GPIO21' in main
          leds=Path('firmware/BUSA_1M_WIFI_3v_GOOGLE/BUSA_PCA9685_Leds.h').read_text()
          assert 'kOwnerConfirmedLedSupplyMv=3300' in leds
          assert 'kOwnerConfirmedIndividualLeds=true' in leds
          assert 'kSeriesCurrentLimitingVerified=false' in leds
          assert 'kOeHardwareStateVerified=false' in leds
          assert 'kPhysicalOutputsApproved=false' in leds
          assert 'physicalTestPreflight' in leds
          assert 'physical_test_ready' in main
          assert 'real_led_on' in main
          assert 'ledSimStop("OTA_TRANSFER")' in main
          leds=Path('firmware/BUSA_1M_WIFI_3v_GOOGLE/BUSA_PCA9685_Leds.h').read_text()
          assert '#include "BUSA_PCA9685_Leds.h"' in main
          assert 'kCount=11' in leds and 'kAddress=0x40' in leds
          assert 'kPhysicalOutputsApproved=false' in leds
          assert 'static_assert(!kPhysicalOutputsApproved' in leds
          assert 'if(!kPhysicalOutputsApproved)return false;' in leds
          assert 'BusaLed::snapshot(ch)' in main
          assert 'probePcaLedRegisters(now)' in main
          assert 'ledSimStop("OTA_PREPARE")' in main
          assert 'ledSimStop("OTA_TRANSFER")' in main
          assert 'LED_SIM_MAX_MS=8000U' in main
          assert 'current_limit_verified' in main and 'oe_state_verified' in main
          assert 'server.on("/api/led/sim"' in main
          assert "ledSimJSON()" in main
          assert 'RELAY_PHYSICAL_OUTPUTS=false' in main
          assert 'RELAY_SIM_MAX_MS=10000U' in main
          assert 'contact_feedback_available\\":false' in main or 'contact_feedback_available' in main
          assert 'relaySimStop("OTA_PREPARE")' in main
          assert 'relaySimStop("OTA_TRANSFER")' in main
          assert 'pcfScanError=9' in main
          assert 'if(keypadReady && scanCounts[a]!=5)continue;' in main
          assert 'oneWireNoPresenceCount' in main
          assert 'hqRig(97,52,141,142)' in Path('firmware/BUSA_1M_WIFI_3v_GOOGLE/BUSA_Landscape_V14.h').read_text()
          assert 'tempConverting=anyPresent' in main
          assert 'tempRequestAt=anyPresent?now:0' in main
          assert 'TFT_DISPLAY_IDLE_MS' not in main
          assert 'class="appTabs"' in main
          assert '<div class="rigViewport">' in main
          assert 'data-settings-link="wifi"' in main
          assert 'data-event="warn"' in main
          assert '<button type="button" id="tftUp">' in main
          assert 'tftThemeDark=prefs.getBool("tftDarkColor",false)' in main
          assert 'ru.drawUTF8(x,y,v.c_str())' in main
          assert 'invertDisplay(tftInverted)' in main and 'tftInverted=false' in main
          art=Path('firmware/BUSA_1M_WIFI_3v_GOOGLE/BUSA_ApprovedGraphics_HQ_V14.h').read_text()
          landscape=Path('firmware/BUSA_1M_WIFI_3v_GOOGLE/BUSA_Landscape_V14.h').read_text()
          assert 'v14ApplyPalette(bool dark)' in landscape and 'HQ_NAVY=0x0000' in landscape
          assert 'v14RefreshLive(uint32_t now)' in landscape
          assert 'if(chosen)v14Print(title,tx+1,41,selectedText)' in landscape, 'green bold tab missing'
          assert 'if(i==4)v14Big("OK"' in landscape, 'ambiguous OK still present'
          assert 'HQ_MONO_DARK=dark' in landscape
          assert 'lastRender,2500' in main
          assert 'v14RefreshLive(now)' in main
          google=Path('firmware/BUSA_1M_WIFI_3v_GOOGLE/BUSA_Google.h').read_text()
          assert 'googleDns' in google and 'googleTlsError' in google
          assert 'waterCalibrated' in main and 'waterPulsesPerLiter' in main
          assert '/api/water/calibration/start' in main
          assert '/api/water/calibration/finish' in main
          assert '/api/water/calibration/reset' in main
          assert "flowReady && waterCalibrated" in main
          assert 'waterCalVolume' in main and 'waterCalResult' in main
          assert 'googleInternet' in google and 'probe.connect(remote,443,1600)' in google
          assert 'network_indicators' in main and 'internetLed' in main and 'localLed' in main
          assert 'dataLed' in main and 'data-page="6"' in main, 'unified UI tabs/status missing'
          assert 'otaUiUploading' in main, 'OTA browser performance guard missing'
          assert 'v14DataLast' in landscape and 'googleEnabled?1:0' in landscape, 'TFT Google state LED missing'
          assert 'cloudUpdateJSON()' in Path('firmware/BUSA_1M_WIFI_3v_GOOGLE/BUSA_Google.h').read_text()
          assert '#include <esp_ota_ops.h>' in main
          assert 'esp_ota_get_running_partition()' in main
          assert 'esp_ota_get_next_update_partition(nullptr)' in main
          assert 'candidate_fits_slot' in main
          assert 'remote_install_enabled\\":false' in main or 'remote_install_enabled' in main
          assert 'signed_image_verified\\":false' in main or 'signed_image_verified' in main
          assert 'remote_install_enabled\\":true' not in main, 'Cloud update must remain disabled, never true'
          assert 'v14NetIndicators()' in landscape and '0x07e0' in landscape and '0x001f' in landscape
          assert 'WiFi.hostByName("script.google.com"' in google
          assert 'secure.setCACert(GOOGLE_TRUST_ANCHOR)' in google
          assert 'static uint16_t HQ_NAVY' in art
          assert 'themeSwitch' in app and 'busa-pwa-dark' in app
          assert 'darkenTftDisplay();' in main
          assert 'screenSt.enableDisplay(true)' in main
          assert 'data-tab="home"' in app and 'data-tab="events"' in app
          assert 'YF-S401' in app and 'data-section="5"' in main
          assert 'Google Диск' in main and '/api/google/test' in Path('firmware/BUSA_1M_WIFI_3v_GOOGLE/BUSA_Google.h').read_text()
          raw=re.search(r'R"HTMLBUSA\((.*?)\)HTMLBUSA"', main, re.S)
          assert raw, 'Missing embedded HTML'
          for name, html in [('embedded',raw.group(1)),('iphone',app)]:
              script=re.search(r'<script>(.*?)</script>', html, re.S)
              assert script, name+' missing script'
              Path('/tmp/busa-'+name+'.js').write_text(script.group(1))
              assert html.count('<section')==html.count('</section>'), name+' unbalanced sections'
          PY
          node --check /tmp/busa-embedded.js
          node --check /tmp/busa-iphone.js
      - name: Package full recovery BIN plus app-only BIN
        run: |
          SDK="$HOME/.arduino15/packages/esp32"
          python3 "$SDK/tools/esptool_py/4.5.1/esptool.py" --chip esp32s3 merge_bin --flash_mode dio --flash_freq 80m --flash_size 8MB -o build/BUSA_1M_V14_21_8MB_USB_merged.bin 0x0 build/BUSA_1M_WIFI_3v_GOOGLE.ino.bootloader.bin 0x8000 build/BUSA_1M_WIFI_3v_GOOGLE.ino.partitions.bin 0xe000 "$SDK/hardware/esp32/2.0.17/tools/partitions/boot_app0.bin" 0x10000 build/BUSA_1M_WIFI_3v_GOOGLE.ino.bin
          cp build/BUSA_1M_WIFI_3v_GOOGLE.ino.bin build/BUSA_1M_V14_21_APP_OTA.bin
          cp firmware/BUSA_1M_WIFI_3v_GOOGLE/BUSA_GoogleCA.h build/
          git rev-parse HEAD > build/SOURCE_COMMIT.txt
          arduino-cli lib list > build/LIBRARIES.txt
          test -s build/BUSA_1M_V14_21_8MB_USB_merged.bin
          test -s build/BUSA_1M_WIFI_3v_GOOGLE.ino.bin
          (cd build && sha256sum BUSA_1M_V14_21_8MB_USB_merged.bin BUSA_1M_V14_21_APP_OTA.bin > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: BUSA_V14_21_N8R2_BIN_AND_SHA256
          path: |
            build/


