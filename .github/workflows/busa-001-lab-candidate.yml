name: BUSA-1M-001 LAB candidate build (no physical outputs)
on:
  workflow_dispatch:
  push:
    branches: [feature/busa-001-v074-ui-lab]
    paths:
      - 'firmware/v0.7.2/**'
      - 'tests/**'
      - 'simulation/**'
      - '.github/workflows/busa-001-lab-candidate.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Host regression tests
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m unittest discover -s simulation/v0.7.2 -v
          node --test tests/lab/*.test.cjs
          g++ -std=c++17 -Itests/lab/stubs tests/lab/driver_test.cpp -o /tmp/driver-test
          /tmp/driver-test
      - name: Compile ESP32-S3 LAB firmware
        working-directory: firmware/v0.7.2
        run: |
          set -euo pipefail
          . /opt/esp/idf/export.sh
          idf.py set-target esp32s3
          idf.py build
      - name: Merge and verify firmware image
        working-directory: firmware/v0.7.2
        run: |
          set -euo pipefail
          . /opt/esp/idf/export.sh
          python -m esptool --chip esp32s3 merge_bin -o BUSA-1M-001-LAB-candidate-merged.bin --flash_mode dio --flash_freq 80m --flash_size 16MB 0x0 build/bootloader/bootloader.bin 0x8000 build/partition_table/partition-table.bin 0x10000 build/busa_v072.bin
          sha256sum BUSA-1M-001-LAB-candidate-merged.bin > BUSA-1M-001-LAB-candidate-merged.bin.sha256
          sha256sum -c BUSA-1M-001-LAB-candidate-merged.bin.sha256
          python -m esptool --chip esp32s3 image_info build/busa_v072.bin
          printf '%s\n' "$GITHUB_SHA" > BUILD_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BUSA-1M-001-LAB-CANDIDATE-UNVERIFIED
          path: |
            firmware/v0.7.2/BUSA-1M-001-LAB-candidate-merged.bin
            firmware/v0.7.2/BUSA-1M-001-LAB-candidate-merged.bin.sha256
            firmware/v0.7.2/BUILD_COMMIT.txt
            firmware/v0.7.2/build/flash_args
            firmware/v0.7.2/sdkconfig
          if-no-files-found: error
