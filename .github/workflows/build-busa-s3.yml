name: Build BUSA ESP32-S3 firmware
on:
  push:
    branches:
      - fix/busa-v14-7-sda-reset-build-20261102
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32-S3 core and libraries
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "OneWire" "DallasTemperature" "Adafruit GFX Library" "Adafruit ST7789 Library" "Adafruit ILI9341" "U8g2_for_Adafruit_GFX"
      - name: Build sketch and export binaries
        run: |
          mkdir -p dist
          arduino-cli compile --fqbn esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi --output-dir dist firmware/BUSA_1M_WIFI_3v_GOOGLE
      - uses: actions/upload-artifact@v4
        with:
          name: BUSA_V14_7_PCF8575_GPIO8_ESP32S3
          path: |
            dist/*.bin
            firmware/BUSA_1M_WIFI_3v_GOOGLE/*.ino
            firmware/BUSA_1M_WIFI_3v_GOOGLE/*.h
