name: BUSA v0.7.2 ESP-IDF build (source guarded)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Require genuine v0.7.2 sources
        run: |
          set -euo pipefail
          for f in firmware/v0.7.2/CMakeLists.txt firmware/v0.7.2/main/CMakeLists.txt firmware/v0.7.2/main/idf_component.yml firmware/v0.7.2/main/main.cpp firmware/v0.7.2/main/BusaLogic.h firmware/v0.7.2/main/BusaAutomation.h; do
            test -s "$f" || { echo "::error::Missing $f. Original algorithms must be restored before building."; exit 1; }
          done
      - name: Compile ESP32-S3 N16R8
        working-directory: firmware/v0.7.2
        run: |
          set -euo pipefail
          . /opt/esp/idf/export.sh
          idf.py set-target esp32s3
          idf.py build
      - name: Produce single flash image
        working-directory: firmware/v0.7.2
        run: |
          set -euo pipefail
          . /opt/esp/idf/export.sh
          python -m esptool --chip esp32s3 merge_bin -o BUSA-1M-001-v0.7.2-merged.bin --flash_mode dio --flash_freq 80m --flash_size 16MB 0x0 build/bootloader/bootloader.bin 0x8000 build/partition_table/partition-table.bin 0x10000 build/busa_v072.bin
          sha256sum BUSA-1M-001-v0.7.2-merged.bin > BUSA-1M-001-v0.7.2-merged.bin.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: BUSA-1M-001-v0.7.2-ESP32S3-N16R8
          path: |
            firmware/v0.7.2/BUSA-1M-001-v0.7.2-merged.bin
            firmware/v0.7.2/BUSA-1M-001-v0.7.2-merged.bin.sha256
          if-no-files-found: error
