name: BUSA Android UI parity and APK build
on:
  workflow_dispatch:
  push:
    branches: [feat/busa-android-ui16, fix/busa-android-release-20261116]
    paths: ['android/**', 'ci/generate_android_assets.py', '.github/workflows/busa-android.yml', 'firmware/BUSA_1M_WIFI_3v_GOOGLE/BUSA_Main.h', 'calculator.js', 'calculator.css']
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify UI bytes, native address policy and offline calculator
        run: |
          set -euo pipefail
          python3 android/tests/test_source.py
          python3 android/tests/test_network_binding.py
          node android/tests/test_cloud_view.js
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium
          npm install --prefix /tmp/busa-playwright --no-save --package-lock=false --ignore-scripts playwright@1.56.0
          echo 'NODE_PATH=/tmp/busa-playwright/node_modules' >> "$GITHUB_ENV"
          BUSA_CHROMIUM="$(python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python3 android/tests/test_offline_browser.py
      - name: Build APK (persistent release key when configured)
        env:
          RELEASE_KEYSTORE: ${{ secrets.BUSA_ANDROID_KEYSTORE_B64 }}
          RELEASE_PASSWORD: ${{ secrets.BUSA_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_KEYSTORE" ] && [ -n "$RELEASE_PASSWORD" ]; then
            printf '%s' "$RELEASE_KEYSTORE" | base64 --decode > /tmp/busa-signing.jks
            export BUSA_KEYSTORE_PASS="$RELEASE_PASSWORD"
            python3 android/build.py --keystore /tmp/busa-signing.jks
            export BUSA_KEYSTORE_PASS=android-ci-test-only
            keytool -genkeypair -keystore /tmp/busa-test.jks -storetype PKCS12 -storepass:env BUSA_KEYSTORE_PASS -keypass:env BUSA_KEYSTORE_PASS -alias busa -keyalg RSA -keysize 3072 -validity 365 -dname 'CN=BUSA CI TEST'
            python3 android/build.py --keystore /tmp/busa-test.jks --debug --out /tmp/busa-native-test
            python3 -c 'import json; p="/tmp/busa-native-test/"; print("BUSA_TEST_APK="+p+json.load(open(p+"BUILD.json"))["apk"])' >> "$GITHUB_ENV"
            rm -f /tmp/busa-test.jks
          else
            export BUSA_KEYSTORE_PASS=android-ci-test-only
            keytool -genkeypair -keystore /tmp/busa-signing.jks -storetype PKCS12 -storepass:env BUSA_KEYSTORE_PASS -keypass:env BUSA_KEYSTORE_PASS -alias busa -keyalg RSA -keysize 3072 -validity 365 -dname 'CN=BUSA CI TEST'
            python3 android/build.py --keystore /tmp/busa-signing.jks --debug
            python3 -c 'import json; p="android/out/"; print("BUSA_TEST_APK="+p+json.load(open(p+"BUILD.json"))["apk"])' >> "$GITHUB_ENV"
            echo 'Test APK: configure signing secrets for a persistent release signature.' >> "$GITHUB_STEP_SUMMARY"
          fi
          rm -f /tmp/busa-signing.jks
          python3 android/build.py --unsigned --out android/out/release
      - name: Enable KVM for Android tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test installed APK in Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-metrics
          script: python3 android/tests/test_emulator.py "$BUSA_TEST_APK"
      - uses: actions/upload-artifact@v4
        with:
          name: BUSA-Android-APK
          path: |
            android/out/*.apk
            android/out/APK_SIGNATURE.txt
            android/out/APK_MANIFEST.txt
            android/out/SHA256SUMS.txt
            android/out/release/*.apk
            android/out/release/APK_MANIFEST.txt
            android/out/release/BUILD.json
            android/out/release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BUSA-Android-test-screens
          path: android/out/emulator/
