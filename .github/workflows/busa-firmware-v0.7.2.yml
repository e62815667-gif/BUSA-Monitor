name: BUSA ESP32-S3 v0.7.2 firmware
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/install-esp-idf-action@v1
        with:
          version: v5.3.2
          target: esp32s3
      - name: Build ESP32-S3
        working-directory: firmware/v0.7.2
        run: |
          idf.py set-target esp32s3
          idf.py build
      - name: Create merged flash image
        working-directory: firmware/v0.7.2
        run: |
          python -m esptool --chip esp32s3 merge_bin -o BUSA_1M_001_v0.7.2_merged.bin --flash_mode dio --flash_freq 80m --flash_size 16MB 0x0 build/bootloader/bootloader.bin 0x8000 build/partition_table/partition-table.bin 0x10000 build/busa_v072.bin
          sha256sum BUSA_1M_001_v0.7.2_merged.bin > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BUSA_1M_001_v0.7.2_merged
          path: |
            firmware/v0.7.2/BUSA_1M_001_v0.7.2_merged.bin
            firmware/v0.7.2/SHA256SUMS.txt
