name: BUSA V15.6 N16R8 Full Firmware
on:
  push:
    branches:
      - fix/busa-v15-6-modules-boot-ui-20261101
    paths:
      - 'firmware/BUSA_1M_WIFI_3v_GOOGLE/**'
      - 'tests/**'
      - 'online/index.html'
      - '.github/workflows/busa-v15-6-module-boot-ui.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: busa-v15-6-n16r8-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install pinned ESP32 core and libraries
        run: |
          mkdir -p releases/V15_6_N16R8
          exec > >(tee releases/V15_6_N16R8/install_debug.log) 2>&1
          retry() { local i; for i in 1 2 3 4; do "$@" && return 0; echo "Retry $i of $*: failure"; sleep $((i*6)); done; return 1; }
          retry arduino-cli config init
          retry arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          retry arduino-cli core update-index
          retry arduino-cli core install esp32:esp32@2.0.17
          retry arduino-cli lib install "Adafruit BusIO@1.17.4"
          retry arduino-cli lib install "ArduinoJson@6.21.5"
          retry arduino-cli lib install "OneWire@2.3.8"
          retry arduino-cli lib install "DallasTemperature@4.0.6"
          retry arduino-cli lib install "Adafruit GFX Library@1.13.0"
          retry arduino-cli lib install "Adafruit ST7735 and ST7789 Library@1.12.0"
          retry arduino-cli lib install "Adafruit ILI9341@1.7.0"
          retry arduino-cli lib install "U8g2_for_Adafruit_GFX@1.8.0"
          echo INSTALL_DONE
      - name: Apply repository-pinned network compatibility fixes
        run: python3 tools/patch_arduino_2_0_17.py "$HOME/.arduino15/packages/esp32/hardware/esp32/2.0.17"
      - name: Test N16R8 and retained full monitoring logic
        run: |
          python3 tests/test_v15_6_n16r8.py
          python3 tests/test_board_boot.py
          python3 tests/test_unified_ui_v15_3.py
          node tests/test_app_v153_bootfix.js
          python3 tests/test_v15_architecture.py
          python3 tests/test_v15_sound_alarms.py
          python3 tests/test_temperature.py
          python3 tests/test_wifi_recovery.py
          python3 tests/test_wifi_integration.py
          python3 tests/test_google_transport.py
          node tests/test_local_fetch.js
          node tests/test_temperature_ui.js
      - name: Generate and validate GTS Root R1–R4 trust anchors
        run: |
          mkdir -p releases/V15_6_N16R8
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee releases/V15_6_N16R8/cert_debug.log
          from pathlib import Path
          import subprocess
          roots = {}
          expected_sha256 = {
            'R1':'D947432ABDE7B7FA90FC2E6B59101B1280E0E1C7E4E40FA3C6887FFF57A7F4CF',
            'R2':'8D25CD97229DBF70356BDA4EB3CC734031E24CF00FAFCFD32DC76EB5841C7EA8',
            'R3':'34D8A73EE208D9BCDB0D956520934B4E40E69482596E8B6F73C8426B010A6F48',
            'R4':'349DFA4058C5E263123B398AE795573C4E1313C83FE68F93556CD5E8031B3C7D',
          }
          # Reuse the exact four GTS certificates shipped in the proven V15.2
          # firmware. Pin both the whole app SHA256 and each X.509 fingerprint.
          # No outbound PKI download is required by the build runner.
          import re, hashlib
          previous=Path('releases/V15_2_N16R8/BUSA_V15_2_N16R8_FULL_APP_OTA.bin')
          image=previous.read_bytes()
          assert hashlib.sha256(image).hexdigest()=='45b8aeceb77705bf98246281fe223e29d7c9fbe688339f529886bc6e14e54b01', 'Base image changed unexpectedly'
          matches=re.findall(rb'-----BEGIN CERTIFICATE-----\r?\n.*?-----END CERTIFICATE-----',image,re.S)
          assert len(matches)==4, f'Expected four proven trust anchors; found {len(matches)}'
          for n in ('R1','R2','R3','R4'):
            pem=matches[int(n[1])-1].decode('ascii')+'\n'
            file=Path('/tmp/BUSA_GTS_Root_'+n+'.pem')
            file.write_text(pem)
            assert pem.count('-----BEGIN CERTIFICATE-----')==1, n
            fingerprint=subprocess.check_output(['openssl','x509','-in',str(file),'-noout','-fingerprint','-sha256'],text=True).strip().split('=',1)[1].replace(':','').upper()
            assert fingerprint==expected_sha256[n], f'{n}: unexpected trust anchor {fingerprint}'
            roots[n]=pem.strip()
          bundle='\n'.join(roots[n] for n in ('R1','R2','R3','R4'))+'\n'
          assert bundle.count('-----BEGIN CERTIFICATE-----')==4
          p=Path('firmware/BUSA_1M_WIFI_3v_GOOGLE/BUSA_GoogleCA.h')
          p.write_text('const char GOOGLE_TRUST_ANCHOR[] PROGMEM=R"GOOGLECERT(\n'+bundle+')GOOGLECERT";\n')
          print('Verified trust anchors: GTS R1, R2, R3, R4. TLS verification is mandatory.')
          PY
      - name: Compile FULL firmware for N16R8 (16 MB flash, OPI PSRAM)
        run: |
          mkdir -p build_v15_6_n16r8
          set -o pipefail
          arduino-cli compile --clean --fqbn 'esp32:esp32:esp32s3:FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,PSRAM=opi,CDCOnBoot=cdc,USBMode=hwcdc,FlashMode=qio' --output-dir build_v15_6_n16r8 firmware/BUSA_1M_WIFI_3v_GOOGLE 2>&1 | tee build_v15_6_n16r8/compile.log
      - name: Verify binaries and produce USB merged / OTA application
        run: |
          SDK="$HOME/.arduino15/packages/esp32"
          ESPTOOL="$SDK/tools/esptool_py/4.5.1/esptool.py"
          BOOTAPP="$SDK/hardware/esp32/2.0.17/tools/partitions/boot_app0.bin"
          python3 "$ESPTOOL" --chip esp32s3 merge_bin --flash_mode dio --flash_freq 80m --flash_size 16MB -o build_v15_6_n16r8/BUSA_V15_6_N16R8_FULL_USB_merged.bin 0x0 build_v15_6_n16r8/BUSA_1M_WIFI_3v_GOOGLE.ino.bootloader.bin 0x8000 build_v15_6_n16r8/BUSA_1M_WIFI_3v_GOOGLE.ino.partitions.bin 0xe000 "$BOOTAPP" 0x10000 build_v15_6_n16r8/BUSA_1M_WIFI_3v_GOOGLE.ino.bin
          cp build_v15_6_n16r8/BUSA_1M_WIFI_3v_GOOGLE.ino.bin build_v15_6_n16r8/BUSA_V15_6_N16R8_FULL_APP_OTA.bin
          (cd build_v15_6_n16r8 && sha256sum BUSA_V15_6_N16R8_FULL_USB_merged.bin BUSA_V15_6_N16R8_FULL_APP_OTA.bin > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          git rev-parse HEAD > build_v15_6_n16r8/SOURCE_COMMIT.txt
          python3 - <<'PY'
          from pathlib import Path
          base=Path("build_v15_6_n16r8")
          app=base/"BUSA_V15_6_N16R8_FULL_APP_OTA.bin"
          usb=base/"BUSA_V15_6_N16R8_FULL_USB_merged.bin"
          assert app.stat().st_size < 0x300000,app.stat().st_size
          assert usb.stat().st_size <= 16*1024*1024,usb.stat().st_size
          data=(base/"BUSA_1M_WIFI_3v_GOOGLE.ino.partitions.bin").read_bytes()
          assert len(data)>64
          print("APP bytes:",app.stat().st_size,"USB bytes:",usb.stat().st_size,"PART bytes:",len(data))
          PY
      - name: Publish verified BIN files to this independent feature branch
        run: |
          mkdir -p releases/V15_6_N16R8
          cp build_v15_6_n16r8/BUSA_V15_6_N16R8_FULL_USB_merged.bin releases/V15_6_N16R8/
          cp build_v15_6_n16r8/BUSA_V15_6_N16R8_FULL_APP_OTA.bin releases/V15_6_N16R8/
          cp build_v15_6_n16r8/SHA256SUMS.txt releases/V15_6_N16R8/
          cp build_v15_6_n16r8/SOURCE_COMMIT.txt releases/V15_6_N16R8/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/V15_6_N16R8
          git commit -m "Build V15.6 N16R8 full USB/OTA binaries with SHA-256" || true
          git push origin HEAD:refs/heads/${GITHUB_REF_NAME}
      - name: Capture diagnostics when CI fails
        if: failure()
        run: |
          mkdir -p releases/V15_6_N16R8
          {
            echo 'BUSA V15.6 CI failure diagnostics'
            echo 'TESTS'
            for test in tests/test_v15_6_n16r8.py tests/test_v15_3_n16r8.py tests/test_v15_2_n16r8.py tests/test_board_boot.py tests/test_unified_ui_v15_3.py tests/test_v15_architecture.py tests/test_v15_sound_alarms.py tests/test_temperature.py tests/test_wifi_recovery.py tests/test_wifi_integration.py tests/test_google_transport.py; do
              echo ">>> $test"
              python3 "$test" 2>&1 || echo "FAILED $test"
            done
            for test in tests/test_app_v153_bootfix.js tests/test_local_fetch.js tests/test_temperature_ui.js; do
              echo ">>> $test"
              node "$test" 2>&1 || echo "FAILED $test"
            done
            echo 'INSTALL LOG'
            if [ -f releases/V15_6_N16R8/install_debug.log ]; then tail -n 80 releases/V15_6_N16R8/install_debug.log; else echo 'install not reached'; fi
            echo 'CERTIFICATE VALIDATION LOG'
            if [ -f releases/V15_6_N16R8/cert_debug.log ]; then tail -n 80 releases/V15_6_N16R8/cert_debug.log; else echo 'CA step not reached'; fi
            echo 'COMPILE LOG TAIL'
            if [ -f build_v15_6_n16r8/compile.log ]; then tail -n 120 build_v15_6_n16r8/compile.log; else echo 'compile not reached'; fi
          } > releases/V15_6_N16R8/CI_DEBUG.txt
      - name: Record CI completion status for review
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
        run: |
          mkdir -p releases/V15_6_N16R8
          printf 'CI_STATUS=%s\\nSOURCE=%s\\n' "$JOB_RESULT" "$GITHUB_SHA" > releases/V15_6_N16R8/CI_STATUS.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/V15_6_N16R8/CI_STATUS.txt releases/V15_6_N16R8/CI_DEBUG.txt 2>/dev/null || git add releases/V15_6_N16R8/CI_STATUS.txt
          git commit -m "Record full V15.6 N16R8 CI result" || true
          git push origin HEAD:refs/heads/${GITHUB_REF_NAME}
      - uses: actions/upload-artifact@v4
        with:
          name: BUSA_V15_6_N16R8_FULL_BIN_SHA256
          path: |
            build_v15_6_n16r8/BUSA_V15_6_N16R8_FULL_USB_merged.bin
            build_v15_6_n16r8/BUSA_V15_6_N16R8_FULL_APP_OTA.bin
            build_v15_6_n16r8/SHA256SUMS.txt
            build_v15_6_n16r8/SOURCE_COMMIT.txt
