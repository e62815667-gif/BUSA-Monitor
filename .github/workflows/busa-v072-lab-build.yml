name: BUSA v0.7.2 LAB-only ESP32-S3 firmware
on:
  workflow_dispatch:
  push:
    branches: [busa-firmware-v0.7.2-build]
    paths:
      - 'firmware/v0.7.2/**'
      - '.github/workflows/busa-v072-lab-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Compile lab firmware for ESP32-S3
        working-directory: firmware/v0.7.2
        run: |
          set -euo pipefail
          . /opt/esp/idf/export.sh
          idf.py set-target esp32s3
          idf.py build
      - name: Merge image and verify digest
        working-directory: firmware/v0.7.2
        run: |
          set -euo pipefail
          . /opt/esp/idf/export.sh
          python -m esptool --chip esp32s3 merge_bin -o BUSA-1M-001-v0.7.2-LAB-merged.bin --flash_mode dio --flash_freq 80m --flash_size 16MB 0x0 build/bootloader/bootloader.bin 0x8000 build/partition_table/partition-table.bin 0x10000 build/busa_v072.bin
          sha256sum BUSA-1M-001-v0.7.2-LAB-merged.bin > BUSA-1M-001-v0.7.2-LAB-merged.bin.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: BUSA-1M-001-v0.7.2-LAB-ESP32S3-UNVERIFIED
          path: |
            firmware/v0.7.2/BUSA-1M-001-v0.7.2-LAB-merged.bin
            firmware/v0.7.2/BUSA-1M-001-v0.7.2-LAB-merged.bin.sha256
          if-no-files-found: error
