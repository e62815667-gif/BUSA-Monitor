name: Build BUSA 15.0 Wi-Fi Google TFT N16R8 OTA preserves NVS
on:
  push:
    branches: [feature/busa-v15-0-wifi-google-tft-20261103, fix/busa-v15-0-ap-recovery-20261103]
    paths:
      - '.github/workflows/busa-unified-tft-status-20261103.yml'
      - 'firmware/BUSA_1M_WIFI_3v_GOOGLE/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install toolchain
        run: |
          set -euo pipefail
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17
          arduino-cli lib install "Adafruit BusIO@1.17.4"
          arduino-cli lib install "OneWire@2.3.8"
          arduino-cli lib install "DallasTemperature@4.0.6"
          arduino-cli lib install "Adafruit GFX Library@1.13.0"
          arduino-cli lib install "Adafruit ST7735 and ST7789 Library@1.12.0"
          arduino-cli lib install "Adafruit ILI9341@1.7.0"
          arduino-cli lib install "U8g2_for_Adafruit_GFX@1.8.0"
      - name: Generate verified Google CA bundle
        run: |
          python3 - <<'PY'
          import hashlib,ssl,urllib.request
          from pathlib import Path
          fingerprints={
            'gtsr1':'d947432abde7b7fa90fc2e6b59101b1280e0e1c7e4e40fa3c6887fff57a7f4cf',
            'gtsr2':'8d25cd97229dbf70356bda4eb3cc734031e24cf00fafcfd32dc76eb5841c7ea8',
            'gtsr3':'34d8a73ee208d9bcdb0d956520934b4e40e69482596e8b6f73c8426b010a6f48',
            'gtsr4':'349dfa4058c5e263123b398ae795573c4e1313c83fe68f93556cd5e8031b3c7d'}
          bundle=[]
          for name,expected in fingerprints.items():
            pem=urllib.request.urlopen('https://pki.goog/repo/certs/'+name+'.pem',timeout=20).read().decode()
            assert hashlib.sha256(ssl.PEM_cert_to_DER_cert(pem)).hexdigest()==expected,name
            bundle.append(pem)
          dest=Path('firmware/BUSA_1M_WIFI_3v_GOOGLE/BUSA_GoogleCA.h')
          dest.write_text('const char GOOGLE_TRUST_ANCHOR[] PROGMEM=R"GOOGLECERT(\n'+'\n'.join(bundle)+')GOOGLECERT";\n')
          PY
      - name: Validate changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('firmware/BUSA_1M_WIFI_3v_GOOGLE/BUSA_Main.h').read_text()
          assert '15v0-N16R8-WIFI-GOOGLE-TFT-NVS-20261103' in s
          assert 'busaRemoteAlarmApply()' in s and 'busaRemoteAlarmJSON()' in s
          remote=Path('firmware/BUSA_1M_WIFI_3v_GOOGLE/BUSA_RemoteAlarm.h').read_text()
          assert 'portENTER_CRITICAL' in remote
          assert 'remoteAlarmId' in remote and 'busaRemoteValidPair' in remote
          google=Path('firmware/BUSA_1M_WIFI_3v_GOOGLE/BUSA_Google.h').read_text()
          assert 'busaGooglePollRemoteAlarms()' in google
          assert 'HTTPC_STRICT_FOLLOW_REDIRECTS' in google
          assert 'id="googleLed"' in s
          assert 'id="espAPStatus"' in s
          assert 'networkLeds(s.network_indicators,s.station,s.google)' in s
          assert 'localOn' in s and 'googleOn' in s
          landscape=Path('firmware/BUSA_1M_WIFI_3v_GOOGLE/BUSA_Landscape_V14.h').read_text()
          assert 'v14GoogleLast' in landscape and 'v14Tiny("ESP32"' in landscape
          portrait=Path('firmware/BUSA_1M_WIFI_3v_GOOGLE/BUSA_ApprovedUI_V13.h').read_text()
          assert 'v13Text("G"' in portrait and 'v13Text("E"' in portrait
          assert 'wifiUiScanJSON()' in s and 'wifiUiBeginScan();' in s
          assert 'manualSsid' not in s
          assert 'get(\'net\').value,pass=get(\'pass\').value' in s
          assert 'AbortSignal.timeout(16000)' in s
          assert 'проверяю результат поиска' in s
          assert 'setInterval(update,3000)' in s
          assert 'statusFailures>=3' in s
          assert 'AbortSignal.timeout(6000)' in s
          assert 'elapsed(now,lastStationCheck,120000)' in s
          assert 'busaGoogleNetworkBusy' in s
          google=Path('firmware/BUSA_1M_WIFI_3v_GOOGLE/BUSA_Google.h').read_text()
          assert 'lastNetProbe' not in google and 'probe.connect(' not in google
          assert 'request.setConnectTimeout(8000)' in google
          assert 'request.setTimeout(10000)' in google
          assert 'if(busaWifiScanRunning)continue;' in google
          assert 'googleInternet=1;googleDns=1;' in google
          assert 'WIFI_SCAN_FAILED' in Path('firmware/BUSA_1M_WIFI_3v_GOOGLE/BUSA_KeypadTFT_UI.h').read_text()
          assert 'KPIN[4]={7,6,5,4}' in s
          assert 'BUSA_TFT_LIVE_REFRESH_MS=200' in s
          assert 'keypadBackupOpen=keypadBackupPrefs.begin("busa-key20",false)' in s
          assert 'writeVerifiedKeymap(prefs,"keys20",newPairs)' in s
          assert 'RESTORED_FROM_BACKUP' in s
          assert 'BACKUP_ACTIVE_PRIMARY_WRITE_FAILED' in s
          assert 'PRIMARY_AND_BACKUP_OK' in s
          assert 'keypadStorageStatus' in s and 'backup_bytes' in s and 'primary_bytes' in s
          assert 'Approved 03.11 BUSA №001 dashboard design' in s
          assert s.count('busaRefTempIcon')>=5
          assert 'class="approvedRig"' in s
          assert 'data:image/webp;base64,' in s and 'data:image/jpeg;base64,' not in s
          assert all('busaIconDetail'+str(i) in s for i in range(4))
          assert Path('assets/BUSA_approved_rig_276.webp').stat().st_size>10000
          assert 'validKeymap(newPairs)' in s and 'return r==5&&c==4;' in s
          assert 'prefs.clear()' not in s and 'nvs_flash_erase' not in s
          ui=Path('firmware/BUSA_1M_WIFI_3v_GOOGLE/BUSA_KeypadTFT_UI.h').read_text()
          assert '#include "BUSA_KeypadTFT_UI.h"' in s
          assert '15v0-N16R8-WIFI-GOOGLE-TFT-NVS-20261103' in s
          assert 'wifiUiBeginScan' in ui and 'WiFi.scanNetworks(true,false,false,160)' in ui
          assert 'WIFIUI_PASSWORD' in ui and 'wifiUiTypeDigit' in ui
          assert 'wifiUiModeCaption()' in ui and '"abc","ABC","123","SYM"' in ui
          assert 'keypadDeferredZero' in s and 'wifiUiLongZero' in s
          assert 'wifiUiDigitFromKey(k)>=0' in s
          assert 'case 1:' in Path('firmware/BUSA_1M_WIFI_3v_GOOGLE/BUSA_Landscape_V14.h').read_text()
          assert 'case 1:' in Path('firmware/BUSA_1M_WIFI_3v_GOOGLE/BUSA_ApprovedUI_V13.h').read_text()
          land=Path('firmware/BUSA_1M_WIFI_3v_GOOGLE/BUSA_Landscape_V14.h').read_text()
          portrait=Path('firmware/BUSA_1M_WIFI_3v_GOOGLE/BUSA_ApprovedUI_V13.h').read_text()
          assert 'i<4;i++' in land and 'calDraft:tempOffset[i]' in land
          assert '"Поиск сети"' in land and '"Сохранить"' in land
          assert '"Рисунок БУСА"' in land and 'themeNames[tftThemeMode]' in land
          assert 'v14SystemInfoRows()' in land and 'u' not in []
          assert 'Wi-Fi подключён: ' in land and 'ESP32 Wi-Fi: ' in land
          assert 'Прошивка: V15.0' in land and 'String(uptimeSeconds%60)' in land
          assert 'v14Print("Прошивка: V15.0",17,163,V14_TEXT)' in land
          assert 'Пороги звука не меняются' not in land
          assert 'UP/DN выбор датчика' not in land
          assert 'v13Text("Прошивка: V15.0"' in portrait
          assert 'tftView=0; // One ENT saves and returns to Settings.' in s
          assert 'saveTempOffset(calSensor,0.0f)' in s
          assert 'KEY_CAPS[20]' in s and 'loadKeymap();' in s
          assert 'wifiUiScanJSON()' in s
          assert 'wifiUiScanJSON()' in ui and 'wifiUiRetries<2' in ui
          assert 'wifiUiScanPending=true' in ui
          assert 'get(\'googleStart\').onclick' in s
          assert 'googleUiChoice' in s and 'busaGoogleUiToggle(enable)' in s
          assert 'busaGoogleUiToggle(bool enable)' in google
          assert 'server.on("/api/google/on"' in google
          assert 'server.on("/api/google/off"' in google
          assert 'prefs.remove("g-token")' not in google
          assert 'prefs.getBool("g-enabled",true)' in google
          assert 'prefs.putBool("g-enabled",enable)' in google
          assert '"enabled"' in google or 'enabled' in google
          assert 'busaStageStaCredentials(ssid,pass)' in s
          assert 'WiFi.setAutoReconnect(false)' in s
          assert 'WiFi.persistent(false)' in s
          assert 'busaStaRestoreLocal()' in s
          assert 'busaStaSwitchPending' in google and 'busaStaSwitching' in google
          assert 'WiFi.reconnect()' not in s
          assert 'prefs.clear()' not in s and 'nvs_flash_erase' not in s
          assert 'APFIX-R1' in s
          assert 'googleUiChoice' in land and 'googleUiChoice' in portrait
          assert 'g-token' in google and 'g-url' in google
          assert 'prefs.clear()' not in s and 'nvs_flash_erase' not in s
          print('PASS 15.0: Wi-Fi shared scanner, Google toggle, local app, NVS/keys20 preserved')
          PY
      - name: Verify both embedded and online JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          m=Path('firmware/BUSA_1M_WIFI_3v_GOOGLE/BUSA_Main.h').read_text()
          index=Path('index.html').read_text()
          embedded=re.search(r'R"HTMLBUSA\((.*?)\)HTMLBUSA"',m,re.S)
          assert embedded, 'Missing local app'
          for name,html in [('local',embedded.group(1)),('online',index)]:
            script=re.search(r'<script>(.*?)</script>',html,re.S)
            assert script and html.count('<section')==html.count('</section>'),name
            assert 'approvedTemp' in html or 'refTemp' in html,name
            Path('/tmp/busa-'+name+'.js').write_text(script.group(1))
          assert 'data:image/jpeg' not in index or index.count('data:image/jpeg')==1
          print('PASS local/online markup structure')
          PY
          node --check /tmp/busa-local.js
          node --check /tmp/busa-online.js
      - name: Build ESP32-S3 N16R8
        run: |
          mkdir -p out
          arduino-cli compile --clean --fqbn 'esp32:esp32:esp32s3:FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,PSRAM=opi,CDCOnBoot=cdc,USBMode=hwcdc,FlashMode=qio' --output-dir out firmware/BUSA_1M_WIFI_3v_GOOGLE
      - name: Produce OTA and USB recovery package without erasing NVS
        run: |
          set -euo pipefail
          cp out/BUSA_1M_WIFI_3v_GOOGLE.ino.bin out/BUSA_15_0_WIFI_GOOGLE_N16R8_OTA_NVS_SAFE.bin
          (cd out && sha256sum BUSA_15_0_WIFI_GOOGLE_N16R8_OTA_NVS_SAFE.bin > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          python3 - <<'PY'
          from pathlib import Path
          p=Path('out/BUSA_15_0_WIFI_GOOGLE_N16R8_OTA_NVS_SAFE.bin')
          assert 60000 < p.stat().st_size < 3000000
          print('APP-ONLY',p.stat().st_size,'bytes; OTA or esptool write_flash at 0x10000')
          print('Do NOT use erase_flash or merged/full USB: preserve original NVS keys20 map')
          PY
          # Four non-overlapping USB flash segments; do not use a merged 0x0 BIN,
          # because its 0xFF padding would overwrite preserved Wi-Fi/keypad NVS.
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,zipfile
          root=Path('out');prefix='BUSA_1M_WIFI_3v_GOOGLE.ino.'
          package={
             'bootloader.bin':root/(prefix+'bootloader.bin'),
             'partitions.bin':root/(prefix+'partitions.bin'),
             'boot_app0.bin':Path.home()/'.arduino15/packages/esp32/hardware/esp32/2.0.17/tools/partitions/boot_app0.bin',
             'app.bin':root/'BUSA_15_0_WIFI_GOOGLE_N16R8_OTA_NVS_SAFE.bin',
          }
          assert all(p.exists() for p in package.values()),package
          assert package['bootloader.bin'].stat().st_size<0x8000
          assert package['partitions.bin'].stat().st_size<=0x1000
          assert package['boot_app0.bin'].stat().st_size<=0x2000
          assert 60000<package['app.bin'].stat().st_size<0x300000
          instructions=(
            'BUSA 15.0 APFIX-R1 — USB recovery for ESP32-S3 N16R8\n'
            'Preserve NVS. Do not use erase_flash, full/merged BIN or overwrite 0x9000.\n'
            'Install esptool: python -m pip install esptool==4.7.0\n'
            'Disconnect any external high-power loads. Use reliable USB/data cable.\n'
            'Run FLASH_USB.bat COM8 on Windows (adjust COM port).\n'
            'For Linux: python -m esptool --chip esp32s3 --port /dev/ttyACM0 --baud 460800 write_flash --flash_mode dio --flash_freq 40m --flash_size 16MB 0x0 bootloader.bin 0x8000 partitions.bin 0xe000 boot_app0.bin 0x10000 app.bin\n'
            'Do not flash this package from the Wi-Fi app: use the separate OTA BIN.\n'
          )
          bat=('@echo off\r\nsetlocal\r\nset \"PORT=%~1\"\r\nif \"%PORT%\"==\"\" set \"PORT=COM8\"\r\npython -m esptool --chip esp32s3 --port %PORT% --baud 460800 --before default_reset --after hard_reset write_flash --flash_mode dio --flash_freq 40m --flash_size 16MB 0x0 bootloader.bin 0x8000 partitions.bin 0xe000 boot_app0.bin 0x10000 app.bin\r\npause\r\n')
          sums=''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+name+'\n' for name,p in package.items())
          archive=root/'BUSA_15_0_APFIX_R1_USB_RECOVERY_KEEP_NVS.zip'
          with zipfile.ZipFile(archive,'w',compression=zipfile.ZIP_DEFLATED) as z:
            for name,p in package.items():z.write(p,name)
            z.writestr('README.txt',instructions)
            z.writestr('FLASH_USB.bat',bat)
            z.writestr('SHA256SUMS.txt',sums)
          with zipfile.ZipFile(archive) as z:
            assert z.testzip() is None
            assert len(z.read('app.bin'))==package['app.bin'].stat().st_size
          print('USB PACKAGE VERIFIED:',archive,archive.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: BUSA_15_0_WIFI_GOOGLE_NVS_SAFE_OTA
          path: |
            out/BUSA_15_0_WIFI_GOOGLE_N16R8_OTA_NVS_SAFE.bin
            out/BUSA_15_0_APFIX_R1_USB_RECOVERY_KEEP_NVS.zip
            out/SHA256SUMS.txt
