name: BUSA 1M WiFi 1v recovery diagnostic
on:
  push:
    branches: [lab/busa-r03-recovery-monitor]
    paths:
      - 'firmware/BUSA_1M_WIFI_1v/**'
      - '.github/workflows/busa-1m-wifi-1v.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32-S3 toolchain 2.0.17
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17
      - name: Install dependencies
        run: |
          arduino-cli lib install "OneWire"
          arduino-cli lib install "DallasTemperature"
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit ST7735 and ST7789 Library"
          arduino-cli lib install "Adafruit ILI9341"
          arduino-cli lib install "U8g2_for_Adafruit_GFX"
      - name: Verify N8R2 GPIO, locked outputs and private configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('firmware/BUSA_1M_WIFI_1v/BUSA_1M_WIFI_1v.ino').read_text()
          for v in ('БУСА 1М WiFi 1v','TPIN[4]={38,39,40,41}','KPIN[4]={7,6,5,4}',
                    'BUS_SDA=8,BUS_SCL=9','TFT_CS=10,TFT_MOSI=11,TFT_SCK=12,TFT_DC=13,TFT_RST=14',
                    'FLOW_GPIO=15','RELAY_PHYSICAL_OUTPUTS=false,LED_PHYSICAL_OUTPUTS=false',
                    'prefs.getString("ssid","")', 'prefs.getString("pass","")'):
              assert v in s, v
          assert 'digitalWrite(' not in s and 'pinMode(KPIN' not in s
          assert '123456789' not in s # do not embed private credentials
          for forbidden in ('#include <BLE','BLEDevice','BLESecurity','startScreen();','renderScreen(now);'):
              assert forbidden not in s, f"Recovery firmware unexpectedly has {forbidden}"
          assert 'WiFi.setSleep(false)' in s
          assert 'setInterval(update,1500)' in s
          assert 'bluetooth_enabled' in s and 'startScreen();' not in s
          assert 'BUSA-1M-001-R04' in s
          assert '/api/wifi/scan' in s and 'data-section="5"' in s
          assert 'id="ssid"' not in s and 'get(\'ssid\')' not in s
          assert "let ssid=get('net').value" in s
          for screen in ('Главная','Температуры','Отбор','Графики','События','Настройки'):
              assert screen in s
          print('N8R2 GPIO unchanged, outputs locked; no user password in public source')
          PY
      - name: Compile generic firmware for ESP32-S3 N8R2, 8 MB
        run: |
          mkdir -p build
          set -o pipefail
          arduino-cli compile --fqbn 'esp32:esp32:esp32s3:FlashSize=8M,PSRAM=disabled,CDCOnBoot=cdc,USBMode=hwcdc,FlashMode=dio' --output-dir build firmware/BUSA_1M_WIFI_1v 2>&1 | tee build/compile.log
      - name: Build 8 MB merged image, unconfigured NVS
        run: |
          SDK="$HOME/.arduino15/packages/esp32"
          python3 "$SDK/tools/esptool_py/4.5.1/esptool.py" --chip esp32s3 merge_bin --flash_mode dio --flash_freq 40m --flash_size 8MB -o build/BUSA_1M_WIFI_1v_8MB_merged.bin 0x0 build/BUSA_1M_WIFI_1v.ino.bootloader.bin 0x8000 build/BUSA_1M_WIFI_1v.ino.partitions.bin 0xe000 "$SDK/hardware/esp32/2.0.17/tools/partitions/boot_app0.bin" 0x10000 build/BUSA_1M_WIFI_1v.ino.bin
          test -s build/BUSA_1M_WIFI_1v_8MB_merged.bin
          (cd build && sha256sum BUSA_1M_WIFI_1v_8MB_merged.bin > SHA256SUMS_GENERIC.txt && sha256sum -c SHA256SUMS_GENERIC.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: BUSA_1M_WIFI_1v_N8R2_8MB_NO_BLUETOOTH
          path: |
            build/BUSA_1M_WIFI_1v_8MB_merged.bin
            build/SHA256SUMS_GENERIC.txt
            build/compile.log
